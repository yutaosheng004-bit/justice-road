<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正义之路 · 法学院养成模拟（Demo）</title>
<!-- SECTION: styles -->
<style>
:root{
  --ink:#0f1a2b; --ink2:#152339; --ink3:#1d2f4a; --ink4:#26395a;
  --paper:#f3ecdd; --paper-dim:#c8bfae; --muted:#8d9bb2;
  --gold:#c9a227; --gold-lt:#e8c766; --jade:#4aa3a2; --crim:#c0564f; --azure:#3f7fbf; --violet:#8f7ad6; --moss:#6f9b3f;
  --ok:#5aa46a; --warn:#d9962e; --bad:#d1564f;
  --r:14px; --sh:0 8px 28px rgba(0,0,0,.38);
  --serif:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--paper); background:
   radial-gradient(1100px 620px at 12% -8%, #223a63 0%, transparent 60%),
   radial-gradient(900px 560px at 92% 6%, #123b3a 0%, transparent 58%),
   linear-gradient(180deg,#0c1626 0%,#0a1220 60%,#0b1424 100%) fixed;
  min-height:100vh; font-size:15px; line-height:1.6;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(201,162,39,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,39,.045) 1px,transparent 1px);
  background-size:64px 64px}
h1,h2,h3,h4,.serif{font-family:var(--serif);letter-spacing:.02em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 64px;position:relative;z-index:1}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(10,18,32,.94),rgba(10,18,32,.74));
  border-bottom:1px solid rgba(201,162,39,.28)}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand .seal{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#f0d68a,#c9a227 60%,#8a6d12);color:#1b1608;font-family:var(--serif);font-weight:700;font-size:19px;
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 4px 14px rgba(201,162,39,.3)}
.brand b{font-family:var(--serif);font-size:17px;font-weight:700;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:11.5px;letter-spacing:.14em}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.11);white-space:nowrap}
.chip b{font-family:var(--serif);font-size:14px;font-weight:700}
.chip .k{color:var(--muted)}
.chip.gold b{color:var(--gold-lt)} .chip.jade b{color:#7fd0cf} .chip.crim b{color:#f0938c}
.chip.azur b{color:#8cc4f5} .chip.vio b{color:#c2b0f5}
.chip.flash{animation:flashPulse .7s ease}
@keyframes flashPulse{0%{transform:scale(1)}40%{transform:scale(1.16);background:rgba(201,162,39,.3)}100%{transform:scale(1)}}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:59px;z-index:35;display:flex;gap:6px;overflow-x:auto;padding:9px 14px;
  background:linear-gradient(180deg,rgba(13,23,39,.92),rgba(13,23,39,.6));border-bottom:1px solid rgba(255,255,255,.07);scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:5px}.tabs::-webkit-scrollbar-thumb{background:rgba(201,162,39,.35)}
.tab{flex:none;padding:8px 14px;border-radius:10px;font-size:13.5px;color:#b9c5d8;border:1px solid transparent;transition:.18s;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab.on{color:#1a1408;background:linear-gradient(180deg,#e8c766,#c9a227);border-color:#e8c766;font-weight:700;box-shadow:0 4px 14px rgba(201,162,39,.28)}
.tab.lk{opacity:.5;cursor:not-allowed}
.tab .lock{opacity:.55;font-size:11px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- generic ---------- */
.view{display:none;animation:fadeUp .3s ease}
.view.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:22px 0 14px}
.vhead h2{margin:0;font-size:24px}
.vhead p{margin:0;color:var(--muted);font-size:13px;flex:1;min-width:200px}
.panel{background:linear-gradient(180deg,rgba(29,47,74,.72),rgba(21,35,57,.82));border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.mt{margin-top:12px}.mtl{margin-top:18px}
.hr{height:1px;background:linear-gradient(90deg,rgba(201,162,39,.4),transparent);margin:14px 0}
.muted{color:var(--muted)} .tiny{font-size:12px} .sm{font-size:13px}
.gold{color:var(--gold-lt)} .ok{color:#84d59a} .bad{color:#f0938c} .warn{color:#f0c069}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12)}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;
  background:linear-gradient(180deg,#2b446e,#1c3055);border:1px solid rgba(140,180,230,.3);color:#e9f1fb;
  font-weight:600;transition:.16s;font-size:14px}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:#8cc4f5;box-shadow:0 6px 18px rgba(63,127,191,.3)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#e8c766,#b8912a);color:#1b1608;border-color:#f0d68a}
.btn.gold:hover:not(:disabled){box-shadow:0 6px 18px rgba(201,162,39,.42);border-color:#fff0b8}
.btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);font-weight:500}
.btn.danger{background:linear-gradient(180deg,#8f3b38,#6d2a28);border-color:#c0564f}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.blk{width:100%}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- attribute bars ---------- */
.subj{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;overflow:hidden}
.subj .lv{position:absolute;top:10px;right:11px;font-family:var(--serif);font-size:12px;letter-spacing:.06em}
.subj .nm{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:16px}
.subj .badge{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#0d1420}
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.subj .ds{color:var(--muted);font-size:11.5px;margin-top:7px;line-height:1.45}
.barlabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}

/* ---------- cards ---------- */
.cardgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.lawcard{position:relative;border-radius:13px;padding:13px 13px 11px;overflow:hidden;
  background:linear-gradient(165deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 55%);
  border:1px solid rgba(255,255,255,.14);transition:.2s;cursor:pointer}
.lawcard::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 0% 0%,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
.lawcard:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.42)}
.lawcard .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lawcard .cname{font-family:var(--serif);font-size:16.5px;font-weight:700;line-height:1.3}
.lawcard .cost{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#7fc0ff,#2b6ca8);font-weight:700;font-size:13px;color:#04101c;border:1px solid rgba(255,255,255,.4)}
.lawcard .law{font-size:11.5px;color:var(--gold-lt);margin-top:5px;font-family:var(--serif)}
.lawcard .quote{font-size:11.5px;color:#b7c4d6;margin-top:4px;line-height:1.5;border-left:2px solid rgba(201,162,39,.5);padding-left:7px}
.lawcard .desc{font-size:12px;color:#d7dfec;margin-top:7px;line-height:1.5}
.lawcard .meta{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}
.rarity{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:5px}
.rSR{background:rgba(143,122,214,.24);color:#c2b0f5;border:1px solid rgba(143,122,214,.5)}
.rSSR{background:rgba(201,162,39,.22);color:#f0d68a;border:1px solid rgba(201,162,39,.6)}
.rR{background:rgba(120,150,190,.2);color:#b9d0ea;border:1px solid rgba(120,150,190,.45)}
.kind{font-size:11px;color:var(--muted)}
.decktag{position:absolute;top:0;right:0;padding:2px 9px 4px;border-bottom-left-radius:9px;font-size:11px;
  background:linear-gradient(180deg,#e8c766,#c9a227);color:#1b1608;font-weight:700}
.lockmask{position:absolute;inset:0;background:rgba(9,15,26,.78);backdrop-filter:blur(1.5px);display:grid;place-content:center;gap:6px;text-align:center;padding:12px}
.lockmask span{font-size:12px;color:var(--muted)}

/* ---------- case list ---------- */
.caselisted{border-radius:12px;border:1px solid rgba(255,255,255,.1);padding:14px;
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015));display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.caselisted .st{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);font-size:19px;color:#0d1420}
.caselisted .info{flex:1;min-width:180px}
.caselisted h4{margin:0;font-size:16.5px}
.caselisted .sub{font-size:12px;color:var(--muted);margin-top:2px}
.stars{letter-spacing:2px;color:var(--gold);font-size:12px}
.done{color:#84d59a;font-size:12px}
.filterrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.segbtn{padding:6px 12px;border-radius:9px;font-size:12.5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#c3d0e2}
.segbtn.on{background:rgba(201,162,39,.2);border-color:var(--gold);color:#f0d68a;font-weight:700}

/* ---------- court ---------- */
.court{border-radius:16px;overflow:hidden;border:1px solid rgba(201,162,39,.3);
  background:linear-gradient(180deg,rgba(15,26,43,.9),rgba(11,20,36,.96))}
.court .roof{padding:11px 14px;background:linear-gradient(180deg,rgba(201,162,39,.2),transparent);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid rgba(201,162,39,.22)}
.court .roof b{font-family:var(--serif);font-size:15px}
.duel{display:grid;grid-template-columns:1fr 74px 1fr;gap:10px;padding:14px}
@media(max-width:720px){.duel{grid-template-columns:1fr;gap:8px}.vscol{order:-1}}
.fighter{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
.fighter .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:21px;flex:none;border:1px solid rgba(255,255,255,.18)}
.fighter .who b{font-size:14.5px;display:block;font-family:var(--serif)}
.fighter .who small{color:var(--muted);font-size:11.5px}
.hpwrap{margin-top:6px}
.hpline{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.sbar{height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:3px 0 7px}
.sbar i{display:block;height:100%;border-radius:99px;transition:width .45s ease}
.sbar.hp i{background:linear-gradient(90deg,#6fd08a,#3f8f56)}
.sbar.hp.low i{background:linear-gradient(90deg,#f0a06a,#c0564f)}
.sbar.mp i{background:linear-gradient(90deg,#7fc0ff,#2b6ca8)}
.sbar.sh i{background:linear-gradient(90deg,#e8c766,#a2810f)}
.vscol{display:grid;place-items:center;text-align:center}
.vsbalance{font-size:11px;color:var(--muted);margin-top:4px}
.chips-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.statchip{font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.statchip.neg{background:rgba(209,86,79,.18);border-color:rgba(209,86,79,.5);color:#f0938c}
.statchip.pos{background:rgba(90,164,106,.18);border-color:rgba(90,164,106,.5);color:#84d59a}
.logbox{height:150px;overflow-y:auto;margin:0 14px;padding:10px 12px;border-radius:11px;background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.09);font-size:12.5px;line-height:1.65;scrollbar-width:thin}
.logbox::-webkit-scrollbar{width:5px}.logbox::-webkit-scrollbar-thumb{background:rgba(201,162,39,.3)}
.logbox p{margin:0 0 5px;padding-left:10px;border-left:2px solid rgba(255,255,255,.14);color:#c9d5e6}
.logbox p.you{border-color:#7fc0ff;color:#dcefff}
.logbox p.foe{border-color:#c0564f;color:#f0c5c0}
.logbox p.crit{border-color:var(--gold);color:#f5e2a8;font-weight:600}
.logbox p.sys{border-color:var(--violet);color:#cbbcf5}
.hand{display:flex;gap:9px;overflow-x:auto;padding:13px 14px;scrollbar-width:thin}
.hand::-webkit-scrollbar{height:6px}.hand::-webkit-scrollbar-thumb{background:rgba(201,162,39,.3)}
.hcard{flex:none;width:158px;border-radius:12px;padding:10px;text-align:left;
  background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.2);transition:.16s;position:relative}
.hcard:hover:not(:disabled){transform:translateY(-4px);border-color:var(--gold-lt);box-shadow:0 10px 22px rgba(0,0,0,.44)}
.hcard:disabled{opacity:.4;cursor:not-allowed}
.hcard .hn{font-family:var(--serif);font-size:14.5px;font-weight:700;line-height:1.3;margin-bottom:3px;padding-right:22px}
.hcard .hl{font-size:10.5px;color:var(--gold-lt);line-height:1.4}
.hcard .hd{font-size:11px;color:#c5d1e2;margin-top:5px;line-height:1.45}
.hcard .hc{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 25%,#7fc0ff,#2b6ca8);color:#04101c;font-weight:700;font-size:12px}
.hcard.mismatch{border-color:rgba(209,86,79,.6)}
.hcard.mismatch::before{content:"案由不符⚠";position:absolute;bottom:6px;right:8px;font-size:9.5px;color:#f0938c}
.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.dmgpop{position:absolute;font-family:var(--serif);font-weight:800;font-size:24px;pointer-events:none;
  animation:popUp 1s ease forwards;text-shadow:0 2px 12px rgba(0,0,0,.6);z-index:5}
@keyframes popUp{0%{opacity:0;transform:translateY(6px) scale(.7)}25%{opacity:1;transform:translateY(-6px) scale(1.15)}100%{opacity:0;transform:translateY(-40px) scale(1)}}

/* ---------- wizard (case flow) ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{flex:1;min-width:96px;padding:8px 9px;border-radius:10px;font-size:12.5px;text-align:center;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);color:var(--muted)}
.step.on{background:rgba(201,162,39,.18);border-color:var(--gold);color:#f0d68a;font-weight:700}
.step.done{background:rgba(90,164,106,.14);border-color:rgba(90,164,106,.5);color:#84d59a}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;border-radius:11px;margin-bottom:8px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);transition:.15s;font-size:13.5px;line-height:1.5}
.opt:hover{background:rgba(127,192,255,.1);border-color:#8cc4f5}
.opt.on{background:rgba(201,162,39,.16);border-color:var(--gold)}
.opt.good{background:rgba(90,164,106,.18);border-color:#5aa46a}
.opt.evil{background:rgba(209,86,79,.18);border-color:#d1564f}
.opt[disabled]{cursor:default;opacity:.85}
.opt .mk{display:inline-block;width:18px;font-family:var(--serif);color:var(--gold-lt)}
.notebox{border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.6;margin-top:10px;
  background:rgba(143,122,214,.12);border:1px solid rgba(143,122,214,.4)}
.notebox.warn{background:rgba(217,150,46,.13);border-color:rgba(217,150,46,.45)}
.notebox.bad{background:rgba(209,86,79,.14);border-color:rgba(209,86,79,.45)}
.facts{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.75}
.facts b{color:var(--gold-lt);font-family:var(--serif)}

/* ---------- modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(6,11,20,.78);backdrop-filter:blur(4px);z-index:80;
  display:none;align-items:center;justify-content:center;padding:18px}
.mask.on{display:flex}
.dlg{max-width:640px;width:100%;max-height:88vh;overflow-y:auto;border-radius:16px;padding:20px;
  background:linear-gradient(180deg,#1b2c47,#111d31);border:1px solid rgba(201,162,39,.35);box-shadow:0 24px 60px rgba(0,0,0,.6);scrollbar-width:thin}
.dlg::-webkit-scrollbar{width:6px}.dlg::-webkit-scrollbar-thumb{background:rgba(201,162,39,.3)}
.dlg h3{margin:0 0 6px;font-size:20px}
.dlg .dsub{color:var(--muted);font-size:12.5px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{padding:10px 18px;border-radius:11px;font-size:13.5px;background:rgba(20,32,52,.96);border:1px solid rgba(201,162,39,.45);
  box-shadow:0 10px 26px rgba(0,0,0,.5);animation:tstIn .3s ease forwards;max-width:82vw}
.tst.bad{border-color:rgba(209,86,79,.6);color:#f5c3bf}
.tst.ok{border-color:rgba(90,164,106,.6);color:#bfe8c8}
@keyframes tstIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tst.out{animation:tstOut .3s ease forwards}
@keyframes tstOut{to{opacity:0;transform:translateY(12px)}}

/* ---------- misc views ---------- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(201,162,39,.1))}
.tl{position:relative;margin-bottom:12px;font-size:13px;line-height:1.6}
.tl::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(201,162,39,.6)}
.tl .tm{color:var(--muted);font-size:11.5px;font-family:var(--serif);letter-spacing:.05em}
.perk{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);font-size:12.5px}
.perk .ic{font-size:17px;flex:none}
.persona{border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05)}
.persona .pv{font-family:var(--serif);font-size:22px}
.route{border-radius:14px;padding:15px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(165deg,rgba(255,255,255,.08),rgba(255,255,255,.02));position:relative;overflow:hidden}
.route h4{margin:0 0 3px;font-size:18px;display:flex;align-items:center;gap:8px}
.node{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.12)}
.node:last-child{border:0}
.node .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);margin-top:2px}
.node.cur .dot{background:linear-gradient(180deg,#e8c766,#c9a227);color:#1b1608;border-color:#f0d68a}
.node.lockd{opacity:.5}
.evil-meter{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.evil-meter i{display:block;height:100%;background:linear-gradient(90deg,#d9962e,#d1564f,#8b1f1f);transition:width .5s}
.footer{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.09);color:#6d7b93;font-size:11.5px;line-height:1.7}
.footer b{color:#8d9bb2}
@media(max-width:640px){
  .vhead h2{font-size:20px}.panel{padding:13px}.cardgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

}

<script>
/* SECTION: engine 状态引擎 · 顶栏 · 校园养成 · 法条卡组 */
(function () {
  'use strict';
  const D = window.LAW_DATA;
  const G = (window.GAME = {});
  const SAVE_KEY = 'law-academy-demo-v1';

  /* ---------- 默认存档 ---------- */
  function freshSave() {
    const attr = {};
    D.subjects.forEach(function (s) { attr[s.id] = s.id === 'fl' ? 12 : 8; });
    return {
      name: '你',
      term: 1, stage: 'study', act: 5, actMax: 5,
      energy: 100, san: 100, gold: 120, fame: 10, lili: 8,
      rankExp: 0, rankIdx: 0,
      attr: attr,
      deck: D.cards.filter(c => c.starter).map(c => c.id),
      owned: D.cards.filter(c => c.starter).map(c => c.id),
      unlocked: {},           // 已解锁内容 id
      doneCases: [],          // 已完成案件 id
      caseScore: {},          // 案件 → 表现
      wins: 0, losses: 0,
      persona: { yan: 0, ren: 0, tie: 0, shi: 0, xue: 0 },
      selfish: 0,             // 徇私值
      titles: [], buffs: [], labels: [],
      career: null, jobNode: -1, income: 0,
      moralFlags: {},
      log: [],
      examScore: {},
      view: 'campus',
      createdAt: Date.now()
    };
  }

  /* ---------- 存取 ---------- */
  G.load = function () {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) { const s = JSON.parse(raw); return Object.assign(freshSave(), s); }
    } catch (e) { /* 存档损坏则重开 */ }
    return freshSave();
  };
  G.save = function () { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.s)); } catch (e) { } };
  G.reset = function () { localStorage.removeItem(SAVE_KEY); G.s = freshSave(); G.save(); G.renderAll(); G.toast('已重置存档', 'ok'); };

  /* ---------- 工具 ---------- */
  G.subj = function (id) { return D.subjects.find(s => s.id === id); };
  G.card = function (id) { return D.cards.find(c => c.id === id); };
  G.caseById = function (id) { return D.cases.find(c => c.id === id); };
  G.levelOf = function (v) {
    let i = 0;
    D.levels.forEach(function (l, k) { if (v >= l.min) i = k; });
    return { idx: i, name: D.levels[i].name, next: D.levels[i + 1] ? D.levels[i + 1].min : null };
  };
  G.avgAttr = function () {
    const ids = Object.keys(G.s.attr);
    return ids.reduce((a, k) => a + G.s.attr[k], 0) / ids.length;
  };
  G.rank = function () { return D.ranks[G.s.rankIdx]; };
  G.primaryPersona = function () {
    let best = null, v = -1;
    Object.keys(G.s.persona).forEach(function (k) { if (G.s.persona[k] > v) { v = G.s.persona[k]; best = k; } });
    return v >= 3 ? D.personas.find(p => p.id === best) : null;
  };
  G.hasBuff = function (name) { return G.s.buffs.some(b => b.name === name); };
  G.buffVal = function (key) {
    return G.s.buffs.reduce(function (a, b) { return a + (b[key] || 0); }, 0);
  };
  G.attrBonus = function (subjId) {
    // 称号与 buff 带来的属性判定加成
    let extra = 0;
    if (G.s.titles.indexOf('法考上岸') >= 0) extra += 5;
    return extra;
  };
  G.effAttr = function (subjId) { return G.s.attr[subjId] + G.attrBonus(subjId); };
  G.addLog = function (text) {
    G.s.log.unshift({ t: '第' + G.s.term + '学期 · ' + (G.s.stage === 'study' ? '在校' : G.s.stage === 'intern' ? '实习' : '执业'), x: text });
    if (G.s.log.length > 60) G.s.log.length = 60;
  };
  G.gain = function (obj) {
    const parts = [];
    if (obj.gold) { G.s.gold += obj.gold; parts.push((obj.gold > 0 ? '+' : '') + obj.gold + ' 金币'); }
    if (obj.fame) { G.s.fame = Math.max(0, G.s.fame + obj.fame); parts.push((obj.fame > 0 ? '声望+' : '声望') + obj.fame); }
    if (obj.lili) { G.s.lili += obj.lili; parts.push('法理点+' + obj.lili); }
    if (obj.san) { G.s.san = Math.max(0, Math.min(100, G.s.san + obj.san)); parts.push((obj.san > 0 ? '理智+' : '理智') + obj.san); }
    if (obj.energy) { G.s.energy = Math.max(0, Math.min(100, G.s.energy + obj.energy)); parts.push('精力' + (obj.energy > 0 ? '+' : '') + obj.energy); }
    if (obj.exp) Object.keys(obj.exp).forEach(function (k) {
      const add = Math.round(obj.exp[k] * (1 + G.buffVal('expUp') / 100));
      G.s.attr[k] = Math.min(300, G.s.attr[k] + add);
      parts.push(G.subj(k).name + '+' + add);
    });
    if (parts.length) G.toast(parts.join('　'), 'ok');
    return parts;
  };
  G.addRankExp = function (n) {
    G.s.rankExp += n;
    let idx = 0;
    D.ranks.forEach(function (r, k) { if (G.s.rankExp >= r.min) idx = k; });
    if (idx > G.s.rankIdx) {
      G.s.rankIdx = idx;
      G.addLog('段位晋升：<b>' + D.ranks[idx].name + '</b>');
      G.dlg({
        title: '段位晋升', sub: '法庭战绩被写进律所战绩墙',
        html: '<div style="text-align:center;padding:14px"><div style="font-family:var(--serif);font-size:30px;color:var(--gold-lt)">' +
          D.ranks[idx].name + '</div><p class="muted mt">逻辑与法理的双重积累，解锁更高阶案件与职业节点。</p></div>',
        actions: [{ label: '继续', gold: true }]
      });
    }
  };

  /* ---------- toast ---------- */
  G.toast = function (msg, cls) {
    const box = document.getElementById('toast');
    const el = document.createElement('div');
    el.className = 'tst ' + (cls || '');
    el.innerHTML = msg;
    box.appendChild(el);
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 320); }, 2600);
    if (box.children.length > 4) box.firstChild.remove();
  };

  /* ---------- 弹窗 ---------- */
  G.dlg = function (o) {
    const mask = document.getElementById('mask'), dlg = document.getElementById('dlg');
    dlg.innerHTML = '<h3>' + o.title + '</h3>' + (o.sub ? '<div class="dsub">' + o.sub + '</div>' : '') +
      '<div id="dlgBody">' + o.html + '</div>' +
      (o.actions ? '<div class="btnrow mt" id="dlgAct"></div>' : '');
    const acts = dlg.querySelector('#dlgAct');
    if (o.actions) o.actions.forEach(function (a, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn ' + (a.gold ? 'gold' : a.danger ? 'danger' : a.ghost ? 'ghost' : '');
      b.innerHTML = a.label;
      b.onclick = function () {
        if (a.keep) { const r = a.fn && a.fn(dlg); if (r === false) return; G.closeDlg(); return; }
        G.closeDlg();
        if (a.fn) a.fn(dlg);
      };
      acts.appendChild(b);
    });
    mask.classList.add('on');
    if (o.after) o.after(dlg);
  };
  G.closeDlg = function () { document.getElementById('mask').classList.remove('on'); };

  /* ---------- 顶栏 ---------- */
  const stageName = { study: '法学院在校', intern: '法律实习', career: '执业期' };
  G.renderStats = function () {
    const p = G.primaryPersona();
    const items = [
      { k: 'term', cls: '', label: '进度', val: '第' + G.s.term + '学期 · ' + stageName[G.s.stage], sub: '行动 ' + G.s.act + '/' + G.s.actMax },
      { k: 'energy', cls: 'azur', label: '精力', val: G.s.energy + '%' },
      { k: 'san', cls: 'vio', label: '理智', val: G.s.san },
      { k: 'gold', cls: 'gold', label: '金币', val: G.s.gold },
      { k: 'fame', cls: 'crim', label: '声望', val: G.s.fame },
      { k: 'lili', cls: 'jade', label: '法理点', val: G.s.lili },
      { k: 'rank', cls: '', label: '段位', val: G.rank().name, sub: '人格：' + (p ? p.name : '未定型') }
    ];
    document.getElementById('statChips').innerHTML = items.map(function (i) {
      return '<span class="chip ' + i.cls + '" data-k="' + i.k + '"><span class="k">' + i.label + '</span><b>' + i.val + '</b>' +
        (i.sub ? '<span class="k">· ' + i.sub + '</span>' : '') + '</span>';
    }).join('');
  };

  /* ---------- 页签 ---------- */
  const TABS = [
    { id: 'campus', name: '校园养成', lock: () => false },
    { id: 'deck', name: '法条卡组', lock: () => false },
    { id: 'case', name: '案件办案', lock: () => false },
    { id: 'court', name: '法庭辩论', lock: () => false },
    { id: 'exam', name: '考试副本', lock: () => false },
    { id: 'career', name: '生涯路线', lock: () => G.s.stage === 'study' && G.s.term < 3 },
    { id: 'record', name: '档案日志', lock: () => false }
  ];
  G.renderTabs = function () {
    document.getElementById('tabs').innerHTML = TABS.map(function (t) {
      const locked = t.lock();
      return '<button type="button" class="tab' + (G.s.view === t.id ? ' on' : '') + (locked ? ' lk' : '') + '" data-tab="' + t.id + '"' + (locked ? ' disabled' : '') + '>' +
        t.name + (locked ? ' <span class="lock">🔒</span>' : '') + '</button>';
    }).join('');
    TABS.forEach(function (t) {
      document.getElementById('view-' + t.id).classList.toggle('on', t.id === G.s.view);
    });
  };
  G.go = function (v) { G.s.view = v; G.save(); G.renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  /* ---------- 属性卡渲染 ---------- */
  G.attrPanel = function () {
    return '<div class="grid g3">' + D.subjects.map(function (s) {
      const v = G.s.attr[s.id], lv = G.levelOf(v);
      const pct = lv.next ? Math.min(100, (v - D.levels[lv.idx].min) / (lv.next - D.levels[lv.idx].min) * 100) : 100;
      return '<div class="subj">' +
        '<span class="lv" style="color:' + s.color + '">' + lv.name + '</span>' +
        '<div class="nm"><span class="badge" style="background:' + s.color + '">' + s.short + '</span>' + s.name + '</div>' +
        '<div class="bar"><i style="width:' + pct + '%;background:linear-gradient(90deg,' + s.color + ',#e8c766)"></i></div>' +
        '<div class="barlabel"><span>' + v + ' 点</span><span>' + (lv.next ? '距「' + lv.next + '」还差 ' + Math.max(0, lv.next - v) : '已达权威') + '</span></div>' +
        '<div class="ds">' + s.desc + '</div></div>';
    }).join('') + '</div>';
  };

  /* ---------- 校园视图 ---------- */
  const COURSE_ACTIONS = [
    { id: 'cls', name: '专业课听讲', icon: '📖', cost: { act: 1, energy: 12 }, tip: '选定一门课，扎实涨属性', kind: 'subj' },
    { id: 'self', name: '图书馆自习', icon: '🕯️', cost: { act: 1, energy: 9 }, tip: '两科均衡提升，性价比之王', kind: 'two' },
    { id: 'drill', name: '真题刷题', icon: '✍️', cost: { act: 1, energy: 14 }, tip: '涨属性并换少量兼职报酬', kind: 'subj' },
    { id: 'moot', name: '模拟法庭', icon: '🏛️', cost: { act: 1, energy: 16 }, tip: '诉讼法/法理主涨，附带声望', kind: 'moot' },
