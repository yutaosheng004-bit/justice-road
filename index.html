  };

  function personaRow() {
    const p = G.primaryPersona();
    return '<div class="grid g4">' + D.personas.map(function (x) {
      const v = G.s.persona[x.id];
      return '<div class="persona" style="border-color:' + (p && p.id === x.id ? x.color : 'rgba(255,255,255,.12)') + '">' +
        '<div class="tiny muted">' + x.name + '</div><div class="pv" style="color:' + x.color + '">' + v + '</div>' +
        '<div class="tiny muted">' + x.perk + '</div></div>';
    }).join('') + '</div>' +
      '<div class="hr"></div><div class="hpline"><span class="tiny muted">徇私值（' + G.s.selfish + '/5）</span>' +
      '<span class="tiny ' + (G.s.selfish >= 1 ? 'bad' : 'muted') + '">' + moralTag() + '</span></div>' +
      '<div class="evil-meter mt"><i style="width:' + Math.min(100, G.s.selfish / 5 * 100) + '%"></i></div>' +
      '<p class="tiny muted" style="margin:8px 0 0">徇私、乱判、适用法律错误、程序违法会累积徇私值：通报批评→征信扣分→停职→吊销执照（坏结局）。</p>' +
      (p ? '<p class="tiny gold" style="margin:8px 0 0">主导人格「' + p.name + '」生效：' + p.perk + '</p>' : '');
  }
  G.personaRow = personaRow;

  /* 徇私值当前后果提示 */
  function moralTag() {
    const hit = D.badEndings.slice().sort((a, b) => b.at - a.at).find(x => G.s.selfish >= x.at);
    return hit ? '已触发：' + hit.name : '暂未越界';
  }
  G.moralTag = moralTag;

  function stageCareerTitle() {
    if (!G.s.career) return '职业未定 · 待分流';
    const c = D.careers[G.s.career];
    const node = G.s.jobNode >= 0 ? c.nodes[G.s.jobNode] : null;
    return c.name + (node ? ' · ' + node.name : ' · 未入编');
  }
  G.careerTitle = stageCareerTitle;

  function careerDesk() {
    if (!G.s.career) {
      return '<div class="panel mt"><h3 style="margin:0;font-size:18px">等待职业分流</h3>' +
        '<p class="muted sm">你的学籍已结束，请在「生涯路线」选择公职司法线、律师执业线或企业法务线，之后再此处理日常工作。</p>' +
        '<button type="button" class="btn gold mt" data-goto="career">前往选择路线</button></div>';
    }
    const c = D.careers[G.s.career], node = c.nodes[G.s.jobNode];
    let h = '<div class="panel mt" style="border-color:' + c.color + '"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
      '<div class="avatar" style="background:rgba(255,255,255,.08);font-size:24px">' + c.icon + '</div>' +
      '<div style="flex:1;min-width:180px"><h3 style="margin:0;font-size:18px">' + node.name + ' · 日常工作</h3>' +
      '<p class="muted tiny" style="margin:2px 0 0">月薪折算 ' + G.s.income + ' 金币｜本岗位解锁内容：' + node.actions.join('、') + '</p></div></div>' +
      '<div class="grid g3 mt">' + node.actions.map(function (a, i) {
        return '<button type="button" class="opt" data-work="' + i + '"' + (G.s.act >= 1 ? '' : ' disabled') + '>' +
          '<span class="mk">💼</span><b>' + a + '</b><div class="tiny muted" style="margin-top:4px">行动 1｜产出绩效与办案经验</div></button>';
      }).join('') + '</div></div>';
    return h;
  }
  G.careerDesk = careerDesk;

  /* ---------- 行动执行 ---------- */
  function actCost(c) {
    if (c.act && G.s.act < c.act) { G.toast('本学期行动点已用尽，请「结束本学期」', 'bad'); return false; }
    if (c.energy && G.s.energy < c.energy) { G.toast('精力不足，先「散步/早睡」回一口', 'bad'); return false; }
    if (c.act) G.s.act -= c.act;
    if (c.energy) G.s.energy -= c.energy;
    return true;
  }
  G.actCost = actCost;

  function rollSubj(exclude) {
    const ids = D.subjects.map(s => s.id).filter(id => id !== exclude);
    return ids[Math.floor(Math.random() * ids.length)];
  }

  function doAction(id) {
    const a = COURSE_ACTIONS.find(x => x.id === id);
    if (!a || !actCost(a.cost)) { G.save(); G.renderAll(); return; }
    const internPenalty = G.s.stage === 'intern' ? 0.7 : 1;
    let msg = '';
    if (a.kind === 'subj') {
      /* 学科类行动由 handleAction 走选科弹窗，此处兜底 */
      const target = rollSubj();
      const gainExp = {}; gainExp[target] = Math.round((a.id === 'cls' ? 13 : 11) * internPenalty);
      G.gain({ exp: gainExp });
      if (a.id === 'drill') G.gain({ gold: 12 });
      msg = '你刷了一晚上' + G.subj(target).name + '真题';
    } else if (a.kind === 'two') {
      const x = rollSubj(), y = rollSubj(x);
      const gainExp = {}; gainExp[x] = Math.round(8 * internPenalty); gainExp[y] = Math.round(7 * internPenalty);
      G.gain({ exp: gainExp });
      msg = '图书馆自习：' + G.subj(x).name + '、' + G.subj(y).name + ' 双开';
    } else if (a.kind === 'moot') {
      G.gain({ exp: { ssf: Math.round(12 * internPenalty), fl: Math.round(7 * internPenalty) }, fame: 2 });
      msg = '模拟法庭你担任' + (Math.random() < 0.5 ? '审判长' : '对方一辩') + '，被驳回两次但仍拿到优秀辩手';
      if (Math.random() < 0.35) G.gain({ lili: 2 });
    } else if (a.kind === 'rest') {
      G.gain({ energy: 30, san: 10 });
      msg = '操场走了六圈，睡了个饱觉';
    } else if (a.kind === 'job') {
      G.gain({ gold: 45, san: -3 });
      msg = '奶茶店兼职 8 小时，腿麻了但工资到账';
    }
    G.addLog(msg);
    maybeEvent(0.4);
    G.save(); G.renderAll();
  }

  function refund(a) {
    if (a.cost.act) G.s.act += a.cost.act;
    if (a.cost.energy) G.s.energy += a.cost.energy;
    G.renderStats();
  }

  /* ---------- 法条卡组视图 ---------- */
  G.renderDeck = function () {
    const el = document.getElementById('view-deck');
    const s = G.s;
    let h = '<div class="vhead"><h2>法条卡牌库</h2><p>所有法律都是你的卡牌池。办案与辩论时从卡组抽牌；<b class="bad">案由不符的卡打出去即「适用法律错误」</b>，会被当场反驳。持有法理点 <b class="gold">' + s.lili + '</b> 可解锁新卡。</p></div>';
    h += '<div class="filterrow">' + ['all'].concat(D.subjects.map(x => x.id)).map(function (f, i) {
      const label = f === 'all' ? '全部' : G.subj(f).name;
      return '<button type="button" class="segbtn' + (i === 0 ? ' on' : '') + '" data-filter="' + f + '">' + label + '</button>';
    }).join('') + '<span class="muted tiny">卡组 ' + s.deck.length + '/8｜点击下方卡牌可编入或移出卡组</span></div>';

    h += '<div class="cardgrid" id="deckGrid">' + D.cards.map(function (c) {
      const owned = s.owned.indexOf(c.id) >= 0;
      const inDeck = s.deck.indexOf(c.id) >= 0;
      const sub = G.subj(c.subj);
      const kindName = { atk: '进攻', def: '防御', buff: '增益', ctrl: '控制', ult: '终结' }[c.kind];
      return '<div class="lawcard" data-card="' + c.id + '" style="border-color:' + (inDeck ? 'rgba(201,162,39,.55)' : 'rgba(255,255,255,.14)') + '">' +
        (inDeck ? '<span class="decktag">卡组</span>' : '') +
        '<div class="ctop"><div class="cname">' + c.name + '</div><div class="cost">' + c.cost + '</div></div>' +
        '<div class="law">' + c.law + '</div>' +
        '<div class="quote">' + c.text + '</div>' +
        '<div class="desc">' + c.desc + '</div>' +
        '<div class="meta"><span class="rarity r' + c.rarity + '">' + c.rarity + '</span>' +
        '<span class="tag" style="color:' + sub.color + '">' + sub.name + '</span>' +
        '<span class="kind">' + kindName + '　' + (c.power ? '伤害' + c.power : c.shield ? '护盾' + c.shield : c.mp ? '回蓝' + c.mp : c.immune ? '免疫' : '辅助') + '</span>' +
        '<span class="kind">适用：' + c.tags.map(tagName).join('/') + '</span></div>' +
        (owned ? '' : '<div class="lockmask"><span>未解锁 · 需法理点 ' + c.unlock + '</span></div>') +
        '</div>';
    }).join('') + '</div>';
    h += '<p class="tiny muted mt">法条文本为教学示意摘录，个别原理类卡牌标注为「原理」而非具体条文；本 Demo 内容不构成法律意见，实际办案以现行有效法律文本为准。</p>';
    el.innerHTML = h;

    el.querySelectorAll('[data-filter]').forEach(function (b) {
      b.onclick = function () {
        el.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        const f = b.dataset.filter;
        el.querySelectorAll('.lawcard').forEach(function (card) {
          const c = G.card(card.dataset.card);
          card.style.display = (f === 'all' || c.subj === f || c.tags.indexOf(f) >= 0) ? '' : 'none';
        });
      };
    });
    el.querySelectorAll('.lawcard').forEach(function (cardEl) {
      cardEl.onclick = function () { deckCardModal(cardEl.dataset.card); };
    });
  };
  function tagName(t) {
    return { civil: '民事', crime: '刑事', admin: '行政', labor: '劳动', state: '国赔', text: '条文', procedural: '程序', evidence: '证据', debuff: '精神' }[t] || t;
  }
  G.tagName = tagName;

  function deckCardModal(id) {
    const c = G.card(id), owned = G.s.owned.indexOf(id) >= 0, inDeck = G.s.deck.indexOf(id) >= 0;
    const sub = G.subj(c.subj);
    G.dlg({
      title: c.name, sub: c.law + '　' + c.rarity,
      html: '<p class="facts">' + c.text + '</p>' +
        '<p class="sm mt">' + c.desc + '</p>' +
        '<p class="tiny muted">学科：' + sub.name + '（等级 ' + G.levelOf(G.effAttr(c.subj)).name + '）｜消耗法理值 ' + c.cost + '｜适用案由：' + c.tags.map(tagName).join('、') + '</p>' +
        (owned ? '' : '<div class="notebox warn">解锁需消耗 <b>' + c.unlock + ' 法理点</b>，当前持有 ' + G.s.lili + '。解锁永久保留，并可在办案/辩论中额外赚取法理点。</div>'),
      actions: [
        owned
          ? { label: inDeck ? '移出卡组' : '编入卡组', gold: true, fn: function () { toggleDeck(id, inDeck); } }
          : {
            label: '用法理点解锁', gold: true, fn: function () {
              if (G.s.lili < c.unlock) { G.toast('法理点不足（需 ' + c.unlock + '，现有 ' + G.s.lili + '）', 'bad'); return; }
              G.s.lili -= c.unlock; G.s.owned.push(id);
              if (G.s.deck.length < 8) G.s.deck.push(id);
              G.addLog('解锁法条卡：<b>' + c.name + '</b>');
              G.toast('已解锁「' + c.name + '」并' + (G.s.deck.indexOf(id) >= 0 ? '编入卡组' : '候补'), 'ok');
              G.save(); G.renderAll();
            }
          },
        { label: '关闭', ghost: true }
      ]
    });
  }
  function toggleDeck(id, removing) {
    if (removing) { G.s.deck = G.s.deck.filter(x => x !== id); G.toast('已移出卡组', 'ok'); }
    else {
      if (G.s.deck.length >= 8) { G.toast('卡组已满 8 张，先移出一张', 'bad'); return; }
      G.s.deck.push(id); G.toast('已编入卡组（' + G.s.deck.length + '/8）', 'ok');
    }
    G.save(); G.renderAll();
  }

  /* ---------- 结束学期 ---------- */
  function endTerm() {
    const s = G.s;
    s.term += 1;
    // 阶段推进
    if (s.stage === 'study' && s.term > 3) { s.stage = 'intern'; s.actMax = 5; G.addLog('进入<b>法律实习期</b>：法院/律所轮岗开始，案件与法考副本解锁。'); }
    else if (s.stage === 'intern' && s.term > 5) { s.stage = 'career'; s.actMax = 5; G.addLog('实习考核结束，进入<b>职业分流期</b>：请在「生涯路线」选择终局方向。'); }
    s.act = s.actMax;
    s.energy = Math.min(100, s.energy + 45);
    s.buffs.forEach(b => b.dur -= 1);
    const expired = s.buffs.filter(b => b.dur <= 0);
    s.buffs = s.buffs.filter(b => b.dur > 0);
    if (expired.length) G.toast('Buff 到期：' + expired.map(b => b.name).join('、'), '');
    // 挂科限制检查
    if (s.labels.indexOf('学业警示') >= 0 && s.stage === 'study') {
      G.addLog('「学业警示」仍在档案里，辅导员要求你交一份学习规划。');
    }
    // 期末考强制（每学期初提示，不强制阻断）
    G.addLog('新的学期开始了。行动点已刷新。');
    maybeEvent(1);   // 每学期必触发一次随机事件
    G.save(); G.renderAll();
  }
  G.endTerm = endTerm;

  /* ---------- 随机事件 ---------- */
  function eligibleEvents() {
    return D.randEvents.filter(function (e) {
      const c = e.cond || {};
      if (c.stage && c.stage.indexOf(G.s.stage) < 0) return false;
      return true;
    });
  }
  function maybeEvent(prob) {
    const pool = eligibleEvents();
    if (!pool.length || Math.random() > prob) return;
    const e = pool[Math.floor(Math.random() * pool.length)];
    G.showEvent(e);
  }
  G.maybeEvent = maybeEvent;
  G.showEvent = function (e) {
    G.dlg({
      title: '⚡ 随机事件 · ' + e.name, sub: '人生随机系统 · 第' + G.s.term + '学期',
      html: '<p class="facts">' + e.text + '</p><div class="mt" id="evtOpts">' +
        e.options.map(function (o, i) {
          return '<button type="button" class="opt" data-opt="' + i + '"><span class="mk">' + (i ? '◦' : '◦') + '</span>' + o.text + '</button>';
        }).join('') + '</div>',
      actions: []
    });
    document.querySelectorAll('#evtOpts [data-opt]').forEach(function (b) {
      b.onclick = function () {
        const o = e.options[+b.dataset.opt];
        applyOption(o);
        G.closeDlg();
        if (o.note) G.toast(o.note, o.selfish ? 'bad' : 'ok');
        G.addLog('<b>' + e.name + '</b>：' + o.text + (o.note ? '　<span class="muted">' + o.note + '</span>' : ''));
        checkMoral();
        G.save(); G.renderAll();
      };
    });
  };
  G.applyOption = applyOption;
  function applyOption(o) {
    const gain = {};
    ['gold', 'fame', 'lili', 'san', 'energy'].forEach(function (k) { if (o[k]) gain[k] = o[k]; });
    if (o.exp) gain.exp = o.exp;
    G.gain(gain);
    if (o.selfish) { G.s.selfish += o.selfish; G.addLog('徇私值 +' + o.selfish); }
    if (o.persona) Object.keys(o.persona).forEach(function (k) { G.s.persona[k] += o.persona[k]; });
    if (o.buff) { G.s.buffs.push(Object.assign({}, o.buff)); G.toast('获得 Buff：' + o.buff.name, 'ok'); }
    if (o.debuff) { G.s.buffs.push(Object.assign({}, o.debuff)); }
    if (o.label && G.s.labels.indexOf(o.label) < 0) G.s.labels.push(o.label);
  }
  G.checkMoral = checkMoral;
  function checkMoral() {
    const hit = D.badEndings.slice().sort((a, b) => b.at - a.at).find(x => G.s.selfish >= x.at);
    if (hit && !G.s.moralFlags[hit.id]) {
      G.s.moralFlags[hit.id] = true;
      G.addLog('职业事故：<b>' + hit.name + '</b>　' + hit.text);
      if (hit.id === 'b_disbar') {
        G.dlg({
          title: '🚫 坏结局 · ' + hit.name, sub: '第' + G.s.term + '学期',
          html: '<p class="facts">' + hit.text + '</p><p class="sm mt">徇私值达到 ' + G.s.selfish + '。你的职业生涯在这一行红头文件里画了句号。</p>' +
            '<div class="notebox bad">坏结局也是一种结局。下次试试把「说情」写进证据目录。</div>',
          actions: [{ label: '重开一局', gold: true, fn: function () { G.reset(); } }, { label: '继续看档案', ghost: true }]
        });
      } else {
        G.toast('⚠ 职业事故：' + hit.name, 'bad');
        G.gain({ fame: -8 });
      }
    }
  }

  /* ---------- 通用绑定 ---------- */
  function bindCampus(el) {
    el.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () { handleAction(b.dataset.act); };
    });
    el.querySelectorAll('[data-pufa]').forEach(function (b) {
      b.onclick = function () { doPufa(b.dataset.pufa); };
    });
    el.querySelectorAll('[data-work]').forEach(function (b) {
      b.onclick = function () { doWork(+b.dataset.work); };
    });
    el.querySelectorAll('[data-goto]').forEach(function (b) {
      b.onclick = function () { G.go(b.dataset.goto); };
    });
    const et = el.querySelector('#btnEndTerm'); if (et) et.onclick = endTerm;
    const gc = el.querySelector('#btnGoCase'); if (gc) gc.onclick = function () { G.go('case'); };
    const ge = el.querySelector('#btnGoExam'); if (ge) ge.onclick = function () { G.go('exam'); };
  }

  /* 学科选择：用同步流程（内联面板而非异步弹窗） */
  function handleAction(id) {
    const a = COURSE_ACTIONS.find(x => x.id === id);
    if (a.kind === 'subj') {
      if (!actCost(a.cost)) { G.save(); G.renderAll(); return; }
      G.dlg({
        title: '选择主攻学科', sub: a.name + '　·　行动 1 精力 ' + a.cost.energy,
        html: '<div class="grid g3">' + D.subjects.map(function (s) {
          const lv = G.levelOf(G.s.attr[s.id]);
          return '<button type="button" class="opt" data-subj="' + s.id + '"><span class="mk" style="color:' + s.color + '">' + s.short + '</span>' +
            '<b>' + s.name + '</b><span class="tag" style="margin-left:6px;color:' + s.color + '">' + lv.name + '</span>' +
            '<div class="tiny muted" style="margin-top:3px">' + s.desc + '</div></button>';
        }).join('') + '</div>',
        actions: [{ label: '取消（返还行动）', ghost: true, fn: function () { refund(a); G.save(); G.renderAll(); } }],
        after: function (dlg) {
          dlg.querySelectorAll('[data-subj]').forEach(function (b) {
            b.onclick = function () {
              const target = b.dataset.subj;
              const internPenalty = G.s.stage === 'intern' ? 0.7 : 1;
              const gainExp = {}; gainExp[target] = Math.round((a.id === 'cls' ? 13 : 11) * internPenalty * (1 + Math.random() * 0.3));
              G.gain({ exp: gainExp });
              if (a.id === 'drill') G.gain({ gold: 12 });
              G.addLog((a.id === 'cls' ? '在《' + G.subj(target).name + '》课上坐到第一排' : '刷了 ' + (20 + Math.round(Math.random() * 30)) + ' 道' + G.subj(target).name + '真题'));
              G.closeDlg(); maybeEvent(0.4); G.save(); G.renderAll();
            };
          });
        }
      });
      return;
    }
    doAction(id);
  }

  function doPufa(id) {
    const p = D.pufa.find(x => x.id === id);
    if (!actCost({ act: 1, energy: p.cost })) { G.save(); G.renderAll(); return; }
    G.gain(p.reward);
    if (p.reward.buff) G.s.buffs.push(Object.assign({}, p.reward.buff));
    G.addLog('<b>' + p.name + '</b>：' + p.line);
    G.dlg({
      title: p.name, sub: '普法实践 · 民心声望',
      html: '<p class="facts">' + p.line + '</p><p class="sm mt gold">获得：声望+' + p.reward.fame + (p.reward.gold ? '　金币+' + p.reward.gold : '') +
        (p.reward.buff ? '　Buff「' + p.reward.buff.name + '」' : '') + '</p>',
      actions: [{ label: '挺好', gold: true }]
    });
    G.save(); G.renderAll();
  }

  function doWork(i) {
    const c = D.careers[G.s.career];
    if (!c || G.s.jobNode < 0) return;
    const node = c.nodes[G.s.jobNode];
    const actName = node.actions[i];
    if (!actCost({ act: 1, energy: 12 })) { G.save(); G.renderAll(); return; }
    const salary = Math.round(node.salary * 0.25);
    const expMap = {};
    const pool = ['fl', 'ssf', 'mf', 'xzf', 'xf', 'xz'];
    const pick1 = G.s.career === 'gov' ? 'xzf' : G.s.career === 'lawyer' ? 'ssf' : 'mf';
    expMap[pick1] = 9; expMap[pool[Math.floor(Math.random() * pool.length)]] = 5;
    G.gain({ gold: salary, exp: expMap, fame: 2 });
    G.addRankExp(3);
    G.addLog('【' + node.name + '】处理「' + actName + '」，绩效 ' + salary + ' 金币到账');
    checkPromotion();
    maybeEvent(0.5);
    G.save(); G.renderAll();
  }
  G.checkPromotion = checkPromotion;
  function checkPromotion() {
    const c = G.s.career ? D.careers[G.s.career] : null;
    if (!c) return;
    const nextIdx = G.s.jobNode + 1;
    if (nextIdx >= c.nodes.length) return;
    if (window.CAREER && CAREER.canTake) {
      const chk = CAREER.canTake(c.nodes[nextIdx]);
      if (chk.ok) {
        G.dlg({
          title: '📋 组织考察通知', sub: '晋升机会：' + c.nodes[nextIdx].name,
          html: '<p class="sm">' + c.name + '下一岗「<b class="gold">' + c.nodes[nextIdx].name + '</b>」条件已达成：' + chk.detail.join('；') + '。</p>' +
            '<p class="muted tiny mt">接受后将进入新岗位，解锁更大案件池与更高薪资。</p>',
          actions: [{ label: '接受任命', gold: true, fn: function () { CAREER.takeJob(G.s.career, nextIdx); } }, { label: '再想想', ghost: true }]
        });
      }
    }
  }

  /* ---------- 全局导航绑定 ---------- */
  function bindGlobal() {
    document.getElementById('tabs').addEventListener('click', function (e) {
      const b = e.target.closest('[data-tab]');
      if (b && !b.disabled) G.go(b.dataset.tab);
    });
    document.getElementById('btnMenu').onclick = function () {
      const s = G.s;
      G.dlg({
        title: '存档与玩法', sub: '进度自动保存在当前浏览器（localStorage）',
        html: '<p class="tiny muted">存档：第' + s.term + '学期 · ' + stageName[s.stage] + ' · 段位' + G.rank().name + ' · 结案' + s.doneCases.length + '件 · 庭辩' + s.wins + '胜' + s.losses + '负</p>' +
          '<div class="hr"></div><div class="timeline">' +
          ['<div class="tl"><span class="tm">前期</span>校园养成：六科属性打底，法条卡入门，诊所接案</div>',
           '<div class="tl"><span class="tm">中期</span>实习办案：真实改编案例五步流程 + 法庭回合制对战 + 法考副本</div>',
           '<div class="tl"><span class="tm">后期</span>职业分流：公职/律师/法务三线晋升，大案要案与终极结局</div>'].join('') +
          '</div><div class="hr"></div>' +
          '<p class="tiny muted">所有案例均为虚构改编，法条文本为教学示意，不构成法律意见。</p>',
        actions: [
          { label: '另存为文本档案', ghost: true, fn: function () { exportSave(); } },
          { label: '重置存档', danger: true, fn: function () { if (confirm('确定清空当前浏览器存档？')) G.reset(); } },
          { label: '关闭', gold: true }
        ]
      });
    };
    document.getElementById('mask').addEventListener('click', function (e) {
      if (e.target === this && !this.querySelector('.facts')) { /* 保留强提示弹窗，需按钮关闭 */ }
    });
  }

  function exportSave() {
    const blob = new Blob([JSON.stringify(G.s, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '正义之路存档_第' + G.s.term + '学期.json';
    a.click();
    G.toast('存档已导出为 JSON', 'ok');
  }

  /* ---------- 渲染总入口 ---------- */
  G.renderAll = function () {
    G.renderStats();
    G.renderTabs();
    G.renderCampus();
    G.renderDeck();
    if (window.CASE_FLOW) CASE_FLOW.render();
    if (window.COURT) COURT.renderIdle();
    if (window.EXAM) EXAM.render();
    if (window.CAREER) CAREER.render();
    if (window.RECORD) RECORD.render();
  };

  /* ---------- 启动 ---------- */
  G.s = G.load();
  document.addEventListener('DOMContentLoaded', function () {
    bindGlobal();
    G.renderAll();
    G.dlg({
      title: '⚖️ 正义之路 · 法学院养成模拟', sub: 'Demo v1 · 青春法学院 × 司法仕途 × 法庭辩论对战',
      html: '<p class="sm">你是法学院大三学生。六门必修=六项属性，法条=技能卡，案件=关卡，法庭辩论=回合制对战。</p>' +
        '<div class="hr"></div><div class="grid g2">' +
        [['📚', '校园养成', '上课/自习/刷题/模拟法庭涨属性；期末挂科掉声望并打上「学业警示」'],
         ['⚔️', '法庭对战', '逻辑值=血量，法理值=蓝条，正确法条=暴击；案由不符=适用法律错误被反击'],
         ['🗂️', '办案五步', '阅卷取证 → 定性 → 找法条 → 写文书 → 庭辩；判对涨声望金币法理点'],
         ['🛤️', '三条结局', '公职司法线 / 律师执业线 / 企业法务线，外加坏结局']].map(function (x) {
          return '<div class="perk"><span class="ic">' + x[0] + '</span><div><b>' + x[1] + '</b><div class="tiny muted">' + x[2] + '</div></div></div>';
        }).join('') + '</div>' +
        '<div class="notebox warn mt">案例均为虚构改编，法条文本为教学示意，不构成法律意见。进度保存在当前浏览器。</div>',
      actions: [{ label: '开始我的一学期', gold: true }, { label: '先看架构说明', ghost: true, fn: function () { G.showGuide(); } }]
    });
  });
  G.showGuide = function () {
    G.dlg({
      title: '游戏框架（Demo 实现说明）', sub: '五大系统 + 四项独创玩法',
      html: '<div class="timeline">' +
        [['五大系统', '① 学业养成（六科属性/期末考） ② 案件办案（五步流程） ③ 法庭辩论对战（法理值/逻辑值/暴击反击） ④ 职业三分支结局 ⑤ 人设·声望·道德'],
         ['独创玩法', '法条卡牌库与卡组构筑、真实考试副本（期末/法考/公考）、随机事件系统、普法实践玩法'],
         ['Demo 补充（原框架未细化，本版补齐）', '数值化属性与伤害公式、法理点经济（解锁卡牌的唯一货币）、徇私值阶梯惩罚、人格天赋的实际生效规则、学期行动点节拍、案件解锁门槛与失败惩罚、坏结局'],
         ['扩展建议（正式版可做）', '法考主观题阅卷打分、二审/再审关卡、真实裁判文书库接入、多人对抗辩论（对方由真人扮演）、生涯多周目继承、职业事故支线调查程序']].map(function (x) {
          return '<div class="tl"><span class="tm">' + x[0] + '</span><br>' + x[1] + '</div>';
        }).join('') + '</div>',
      actions: [{ label: '明白了', gold: true }]
    });
  };
})();

</script>
<script>
/* SECTION: caseflow 案件办案系统：案件列表 + 五步流程 */
(function () {
  'use strict';
  const D = window.LAW_DATA;
  const G = window.GAME;
  const F = (window.CASE_FLOW = {});

  const STAGE_ORDER = { study: 0, intern: 1, career: 2 };
  const KIND_ICON = { civil: '⚖️', admin: '🏛️', crime: '🔒', labor: '👷', state: '📜' };
  const KIND_COLOR = { civil: '#4aa3a2', admin: '#3f7fbf', crime: '#c0564f', labor: '#6f9b3f', state: '#c9a227' };

  F.available = function (c) {
    return STAGE_ORDER[G.s.stage] >= STAGE_ORDER[c.stage];
  };
  F.done = function (id) { return G.s.doneCases.indexOf(id) >= 0; };

  F.render = function () {
    const el = document.getElementById('view-case');
    if (!el) return;
    const s = G.s;
    let h = '<div class="vhead"><h2>案件办案系统</h2><p>' +
      '每一案都是真实改编的司法场景。<b class="gold">阅卷取证 → 定性 → 找法条 → 写文书 → 法庭辩论</b>。' +
      '判案正确涨声望、金币、法理点；判断错误触发职业事故 debuff。</p></div>';

    h += '<div class="filterrow">' +
      ['all', 'open', 'done', 'lock'].map(function (f, i) {
        const label = { all: '全部案件', open: '可办', done: '已结案', lock: '未解锁' }[f];
        return '<button type="button" class="segbtn' + (i === 0 ? ' on' : '') + '" data-cf="' + f + '">' + label + '</button>';
      }).join('') +
      '<span class="muted tiny">已结案 ' + s.doneCases.length + '/' + D.cases.length + '｜法理点 ' + s.lili + '</span></div>';

    h += '<div class="grid g2" id="caseList">' + D.cases.map(function (c) {
      const avail = F.available(c), done = F.done(c.id);
      const sc = s.caseScore[c.id];
      return '<div class="caselisted" data-case="' + c.id + '">' +
        '<div class="st" style="background:' + KIND_COLOR[c.kind] + '">' + KIND_ICON[c.kind] + '</div>' +
        '<div class="info"><h4>' + c.name + '</h4>' +
        '<div class="sub">' + c.kindName + '　<span class="stars">' + '★'.repeat(c.difficulty) + '</span>' +
        (done ? '　<span class="done">✔ 已结案' + (sc ? '（表现 ' + sc.grade + '）' : '') + '</span>' : '') + '</div>' +
        '<div class="tiny muted" style="margin-top:5px">' + c.intro.slice(0, 54) + '…</div></div>' +
        (done ? '<button type="button" class="btn ghost sm" data-re="1">复盘 / 重办</button>' :
          avail ? '<button type="button" class="btn gold sm" data-open="' + c.id + '" data-primary-action="1">受理 ▸</button>' :
            '<span class="pill" style="border-color:rgba(255,255,255,.2);color:#8d9bb2">' + stageNeed(c.stage) + '解锁</span>') +
        '</div>';
    }).join('') + '</div>';

    h += '<div class="panel mt"><h4 class="serif" style="margin:0 0 6px">办案提示</h4>' +
      '<p class="tiny muted" style="margin:0">选错证据会被对方当庭质疑并扣理智；第三步「适用法条」的选择，会直接决定第五步法庭里哪些是你的<b class="gold">命中加成卡</b>、哪些是<b class="bad">适用法律错误陷阱卡</b>。' +
      '庭前道德抉择会累积徇私值，攒到顶就是坏结局。</p></div>';

    el.innerHTML = h;

    el.querySelectorAll('[data-cf]').forEach(function (b) {
      b.onclick = function () {
        el.querySelectorAll('[data-cf]').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        const f = b.dataset.cf;
        el.querySelectorAll('.caselisted').forEach(function (row) {
          const c = G.caseById(row.dataset.case);
          const ok = F.available(c), dn = F.done(c.id);
          let show = true;
          if (f === 'open') show = ok && !dn;
          else if (f === 'done') show = dn;
          else if (f === 'lock') show = !ok;
          row.style.display = show ? '' : 'none';
        });
      };
    });
    el.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function (e) { e.stopPropagation(); F.start(b.dataset.open); };
    });
    el.querySelectorAll('[data-re]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        replay(G.caseById(b.closest('[data-case]').dataset.case));
      };
    });
  };

  function stageNeed(st) { return st === 'intern' ? '实习期' : '执业期'; }

  /* ---------- 六步流程 ---------- */
  F.start = function (id) {
    const c = G.caseById(id);
    if (!c) return;
    if (G.s.act < 1) { G.toast('本学期行动点已用尽，请「结束本学期」', 'bad'); return; }
    if (G.s.energy < 15) { G.toast('精力不足 15，办案前先回校园休息', 'bad'); return; }
    F.run = {
      case: c, step: 0, score: 0, max: 0, picks: {},
      evidenceWrong: 0, lawWrong: 0, replayDiscount: F.done(id) ? 0.5 : 1
    };
    G.actCost({ act: 1, energy: 15 });
    G.save(); G.renderStats();
    renderStep();
  };

  const STEPS = [
    { key: 'evidence', name: '① 阅卷取证' },
    { key: 'qualify', name: '② 定性' },
    { key: 'lawpick', name: '③ 找法条' },
    { key: 'doc', name: '④ 写文书' },
    { key: 'moral', name: '⑤ 庭前抉择' },
    { key: 'battle', name: '⑥ 法庭辩论' }
  ];
  function stepList() {
    return STEPS.filter(st => st.key !== 'moral' || !!F.run.case.moral);
  }

  function renderStep() {
    const run = F.run, c = run.case;
    const list = stepList();
    const cur = list[run.step];
    if (!cur) { goBattle(); return; }

    let body = '';
    if (cur.key === 'evidence') {
      const p = run.picks.ev = run.picks.ev || [];
      body = '<p class="sm">' + c.evidence.prompt + '</p><p class="tiny muted">可多选。关联性、合法性、真实性三性缺一都会被质疑。</p>' +
        c.evidence.options.map(function (o, i) {
          return '<button type="button" class="opt' + (p.indexOf(i) >= 0 ? ' on' : '') + '" data-ev="' + i + '">' +
            '<span class="mk">' + (p.indexOf(i) >= 0 ? '☑' : '☐') + '</span>' + o.text + '</button>';
        }).join('');
    } else if (cur.key === 'lawpick') {
      const p = run.picks.law = run.picks.law || [];
      body = '<p class="sm">' + c.lawpick.prompt + '</p>' +
        c.lawpick.options.map(function (cid) {
          const card = G.card(cid);
          return '<button type="button" class="opt' + (p.indexOf(cid) >= 0 ? ' on' : '') + '" data-law="' + cid + '">' +
            '<span class="mk">' + (p.indexOf(cid) >= 0 ? '☑' : '☐') + '</span>' +
            '<b>' + card.name + '</b> <span class="tag" style="color:' + G.subj(card.subj).color + '">' + G.subj(card.subj).name + '</span>' +
            '<div class="tiny muted" style="margin-top:3px">' + card.law + '</div></button>';
        }).join('') +
        '<p class="tiny muted">已选 ' + p.length + '/2｜' + (c.lawpick.tip || '把别的案由条文搬进本案，庭上即为「适用法律错误」。') + '</p>';
    } else if (cur.key === 'battle') {
      const b = c.battle;
      const perfPct = Math.round(run.score / Math.max(1, run.max) * 100);
      body = '<div class="grid g2">' +
        '<div class="perk"><span class="ic">🎯</span><div><b>办案表现 ' + perfPct + '%</b><div class="tiny muted">前四步正确率，直接换算为庭审开局增益</div></div></div>' +
        '<div class="perk"><span class="ic">👤</span><div><b>' + b.enemy + '</b><div class="tiny muted">逻辑值 ' + b.hp + '｜' + '★'.repeat(c.difficulty) + '</div></div></div>' +
        '<div class="perk"><span class="ic">🃏</span><div><b>命中法条</b><div class="tiny muted">' + (run.picks.law || []).filter(x => c.lawpick.correct.indexOf(x) >= 0).map(x => G.card(x).name).join('、') + '</div></div></div>' +
        '<div class="perk"><span class="ic">⚠️</span><div><b>误用条文</b><div class="tiny muted">' + ((run.picks.law || []).filter(x => c.lawpick.correct.indexOf(x) < 0).map(x => G.card(x).name).join('、') || '无') + '</div></div></div>' +
        '</div>' +
        '<div class="notebox warn mt">对方开局陈词：「' + b.taunt + '」</div>' +
        '<p class="tiny muted mt">庭审规则：<b>逻辑值=血量</b>，<b>法理值=蓝条</b>（每回合自然回复 2+实务派加成）；' +
        '打出<b class="gold">克制对方当前招数</b>的卡即为正确法条暴击；打出<b class="bad">案由不符</b>的卡会被当庭反驳并反伤。</p>';
    } else {
      const o = c[cur.key], sel = run.picks[cur.key];
      body = '<p class="sm">' + (o.prompt || o.text) + '</p>' +
        (o.prompt ? '' : '<p class="tiny muted">这不是对错，是你的选择。</p>') +
        o.options.map(function (x, i) {
          return '<button type="button" class="opt' + (sel === i ? ' on' : '') + '" data-single="' + i + '">' +
            '<span class="mk">' + String.fromCharCode(65 + i) + '</span>' + x.text + '</button>';
        }).join('');
    }

    const stepsHtml = '<div class="steps">' + list.map(function (st, i) {
      return '<div class="step ' + (i < run.step ? 'done' : i === run.step ? 'on' : '') + '">' + st.name + '</div>';
    }).join('') + '</div>';

    const isLast = run.step === list.length - 2;
    G.dlg({
      title: '案卷 · ' + c.name, sub: c.kindName + '　·　' + '★'.repeat(c.difficulty) + (F.done(c.id) ? '　（复盘重办，收益减半）' : ''),
      html: '<div class="facts">' + c.intro + '</div>' + stepsHtml +
        '<div class="mt">' + body + '</div>' +
        '<div class="notebox tiny" id="stepNote" style="display:none"></div>',
      actions: cur.key === 'battle'
        ? [{ label: '起立，开庭 ▸', gold: true, fn: function () { goBattle(); } }, { label: '临阵退庭', ghost: true, fn: function () { F.run = null; G.go('case'); } }]
        : [{ label: isLast ? '准备完毕，开庭 ▸' : '确认并提交 ▸', gold: true, keep: true, fn: function () { return commit(cur); } },
        { label: '退出办案', ghost: true, fn: function () { F.run = null; G.save(); G.renderAll(); } }],
      after: bindStep(cur)
    });
  }

  function bindStep(cur) {
    return function (dlg) {
      if (cur.key === 'evidence') {
        dlg.querySelectorAll('[data-ev]').forEach(function (b) {
          b.onclick = function () {
            const i = +b.dataset.ev, p = F.run.picks.ev;
            if (p.indexOf(i) >= 0) p.splice(p.indexOf(i), 1); else p.push(i);
            b.classList.toggle('on', p.indexOf(i) >= 0);
            b.querySelector('.mk').textContent = p.indexOf(i) >= 0 ? '☑' : '☐';
          };
        });
      } else if (cur.key === 'lawpick') {
        dlg.querySelectorAll('[data-law]').forEach(function (b) {
          b.onclick = function () {
            const id = b.dataset.law, p = F.run.picks.law;
            if (p.indexOf(id) >= 0) p.splice(p.indexOf(id), 1);
            else { if (p.length >= 2) { G.toast('最多选 2 张法条', 'bad'); return; } p.push(id); }
            b.classList.toggle('on', p.indexOf(id) >= 0);
            b.querySelector('.mk').textContent = p.indexOf(id) >= 0 ? '☑' : '☐';
          };
        });
      } else if (cur.key !== 'battle') {
        dlg.querySelectorAll('[data-single]').forEach(function (b) {
          b.onclick = function () {
            dlg.querySelectorAll('[data-single]').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            F.run.picks[cur.key] = +b.dataset.single;
          };
        });
      }
    };
  }

  function commit(cur) {
    const run = F.run, c = run.case, note = document.getElementById('stepNote');
    run.max += 1;
    let ok = false, txt = '';

    if (cur.key === 'evidence') {
      const p = run.picks.ev || [];
      if (!p.length) { G.toast('至少提交一份证据', 'bad'); return false; }
      const correctN = c.evidence.options.filter(o => o.correct).length;
      const good = p.filter(i => c.evidence.options[i].correct).length;
      const bad = p.length - good;
      ok = bad === 0 && good === correctN;
      run.evidenceWrong += bad;
      if (bad) { G.gain({ san: -6 * bad }); txt += '❌ 提交了 ' + bad + ' 份无关证据，被对方当庭质疑三性（理智 −' + 6 * bad + '）<br>'; }
      else txt += '✅ 证据链干净：关键证据 ' + good + '/' + correctN + '<br>';
      txt += '<span class="tiny muted">' + p.map(i => c.evidence.options[i].note).join('<br>') + '</span>';
    } else if (cur.key === 'qualify' || cur.key === 'doc') {
      const sel = run.picks[cur.key];
      if (sel === undefined) { G.toast('先做一个判断', 'bad'); return false; }
      const o = c[cur.key].options[sel];
      ok = !!o.correct;
      txt = (ok ? '✅ ' : '❌ ') + o.text + (o.note ? '<br><span class="tiny muted">' + o.note + '</span>' : '');
      if (!ok) { G.gain({ san: -5 }); }
    } else if (cur.key === 'lawpick') {
      const p = run.picks.law || [];
      if (p.length !== 2) { G.toast('请选满 2 张法条', 'bad'); return false; }
      const right = p.filter(x => c.lawpick.correct.indexOf(x) >= 0);
      const wrong = p.filter(x => c.lawpick.correct.indexOf(x) < 0);
      ok = right.length === c.lawpick.correct.length && !wrong.length;
      run.lawWrong += wrong.length;
      txt = '✅ 命中 ' + right.length + '/' + c.lawpick.correct.length +
        (wrong.length ? '　❌ 误用 ' + wrong.length + ' 张他案条文（庭上会被反驳）' : '');
      txt += '<br><span class="tiny muted">' + p.map(function (x) {
        return '<b>' + G.card(x).name + '</b>：' + (c.lawpick.notes[x] || '');
      }).join('<br>') + '</span>';
    } else if (cur.key === 'moral') {
      const sel = run.picks.moral;
      if (sel === undefined) { G.toast('先做个决定', 'bad'); return false; }
      const o = c.moral.options[sel];
      const gain = {};
      ['gold', 'fame', 'lili', 'san'].forEach(k => { if (o[k]) gain[k] = o[k]; });
      if (o.exp) gain.exp = o.exp;
      G.gain(gain);
      if (o.selfish) { G.s.selfish += o.selfish; G.addLog('徇私值 +' + o.selfish + '（' + c.name + '）'); }
      if (o.persona) Object.keys(o.persona).forEach(k => { G.s.persona[k] += o.persona[k]; });
      ok = !o.selfish;
      txt = (ok ? '✅ ' : '⚠ ') + (o.note || o.text);
      G.addLog('<b>' + c.name + ' · 庭前抉择</b>：' + o.text);
      G.checkMoral();
    }

    if (ok) run.score += 1;
    if (note) {
      note.style.display = 'block';
      note.className = 'notebox tiny ' + (ok ? '' : cur.key === 'moral' ? 'bad' : 'warn');
      note.innerHTML = txt;
    }
    G.save(); G.renderStats();
    run.step += 1;
    setTimeout(renderStep, 820);
    return false;
  }

  function goBattle() {
    const run = F.run, c = run.case;
    G.closeDlg();
    const perf = Math.max(0.25, run.score / Math.max(1, run.max));
    const refused = c.moral ? !c.moral.options[run.picks.moral].selfish : false;
    window.COURT.start(c, {
      perf: perf, refused: refused,
      hitLaws: (run.picks.law || []).filter(x => c.lawpick.correct.indexOf(x) >= 0),
      wrongLaws: (run.picks.law || []).filter(x => c.lawpick.correct.indexOf(x) < 0),
      evidenceWrong: run.evidenceWrong,
      onEnd: function (win) { afterBattle(c, win, perf, run); }
    });
  }

  function afterBattle(c, win, perf, run) {
    const s = G.s, disc = run.replayDiscount;
    F.run = null;
    if (window.COURT && COURT.clear) COURT.clear();
    if (win) {
      const mult = (perf >= 1 ? 1.3 : perf >= 0.75 ? 1 : 0.72) * disc;
      const rw = c.reward, gain = {
        gold: Math.round(rw.gold * mult), fame: Math.round(rw.fame * mult),
        lili: Math.round(rw.lili * (perf >= 0.75 ? 1.2 : 1) * disc), exp: {}
      };
      Object.keys(rw.exp).forEach(k => { gain.exp[k] = Math.round(rw.exp[k] * mult); });
      G.gain(gain);
      G.addRankExp(Math.round((10 + c.difficulty * 5) * mult));
      s.wins += 1;
      /* 胜诉可洗掉「败诉阴影」 */
      if (s.labels.indexOf('败诉阴影') >= 0) {
        s.labels = s.labels.filter(x => x !== '败诉阴影');
        G.addLog('一场胜诉把「败诉阴影」从档案里刮掉了。');
      }
      if (s.doneCases.indexOf(c.id) < 0) s.doneCases.push(c.id);
      const grade = perf >= 1 ? 'S' : perf >= 0.8 ? 'A' : perf >= 0.55 ? 'B' : 'C';
      s.caseScore[c.id] = { grade: grade, perf: Math.round(perf * 100), win: true, term: s.term };
      const pp = G.primaryPersona();
      if (pp && pp.id === 'ren') G.gain({ fame: 4 });
      G.addLog('结案 <b>' + c.name + '</b>：胜诉（办案表现 ' + grade + '）');
      G.dlg({
        title: '🎉 胜诉 · ' + c.name, sub: '办案表现 ' + grade + '（' + Math.round(perf * 100) + '%）',
        html: '<p class="facts">' + c.battle.winText + '</p>' +
          '<div class="grid g2 mt">' + [['金币', '+' + gain.gold], ['声望', '+' + gain.fame], ['法理点', '+' + gain.lili],
          ['学科经验', Object.keys(gain.exp).map(k => G.subj(k).name + ' +' + gain.exp[k]).join('、') || '—']]
            .map(function (x) { return '<div class="perk"><span class="ic">✦</span><div><b>' + x[0] + '</b><div class="tiny gold">' + x[1] + '</div></div></div>'; }).join('') + '</div>' +
          (gain.lili >= 5 ? '<div class="notebox mt">攒下的法理点可以在「法条卡组」解锁更强的条文。</div>' : ''),
        actions: [{ label: '回案件列表', gold: true, fn: function () { G.go('case'); } }, { label: '去卡组配牌', ghost: true, fn: function () { G.go('deck'); } }]
      });
    } else {
      s.losses += 1;
      G.gain({ fame: -8, san: -12 });
      if (s.labels.indexOf('败诉阴影') < 0) s.labels.push('败诉阴影');
      if (run.lawWrong) { G.s.selfish += 1; G.addLog('适用法律错误被记入办案档案，徇私值 +1'); }
      G.checkMoral();
      const right = c.qualify.options.find(o => o.correct);
      G.dlg({
        title: '⚠ 败诉 · ' + c.name, sub: '声望 −8　理智 −12　获得标签「败诉阴影」',
        html: '<p class="facts">' + c.battle.loseText + '</p>' +
          '<div class="notebox bad">「败诉阴影」：下一场辩论逻辑值上限 −8。<br>' +
          '<b>复盘要点</b>：本案请求权基础是 —— ' + right.text + '<br>' +
          '<span class="tiny muted">' + (right.note || '') + '</span></div>',
        actions: [{ label: '不服，再办一次', gold: true, fn: function () { F.start(c.id); } },
        { label: '回列表', ghost: true, fn: function () { G.go('case'); } }]
      });
    }
    G.save(); G.renderAll();
  }

  function replay(c) {
    G.dlg({
      title: '案卷复盘 · ' + c.name, sub: '已结案（办案表现 ' + (G.s.caseScore[c.id] || {}).grade + '）',
      html: '<p class="facts">' + c.intro + '</p><div class="hr"></div>' +
        '<p class="sm"><b class="gold">① 定性 / 请求权基础</b><br>' + c.qualify.options.find(o => o.correct).text + '</p>' +
        '<p class="sm"><b class="gold">③ 适用法条</b><br>' + c.lawpick.correct.map(function (id) {
          return G.card(id).name + '（' + G.card(id).law + '）';
        }).join('<br>') + '</p>' +
        '<p class="sm"><b class="gold">⑤ 对手</b><br>' + c.battle.enemy + '</p>' +
        '<p class="tiny muted">重办可再次获得经验，收益减半。</p>',
      actions: [{ label: '重新办理', gold: true, fn: function () { F.start(c.id); } }, { label: '关闭', ghost: true }]
    });
  }

  if (G.s) F.render();
})();

</script>
<script>
/* SECTION: court 法庭辩论对战系统（回合制） */
(function () {
  'use strict';
  const D = window.LAW_DATA;
  const G = window.GAME;
  const C = (window.COURT = {});

  let B = null;
  const MAX_ROUND = 12;

  /* ---------- 数值换算：属性决定辩论伤害 ---------- */
  function youMaxHp() {
    let hp = 55 + Math.floor(G.avgAttr() / 3) + G.buffVal('hpUp');
    if (G.s.labels.indexOf('败诉阴影') >= 0) hp -= 8;
    return Math.max(40, hp);
  }
  function youMaxMp() { return 10 + Math.floor(G.effAttr('xz') / 25) + Math.floor(G.effAttr('ssf') / 40); }
  function dmgOf(card) {
    const subMul = 1 + G.effAttr(card.subj) / 100 * 0.62;
    let d = (card.power || 0) * subMul;
    if (B.opts.hitLaws && B.opts.hitLaws.indexOf(card.id) >= 0) d *= 1.28;
    d *= 1 + G.buffVal('dmgUp') / 100;
    const p = G.primaryPersona();
    if (p && p.id === 'xue' && card.subj === 'fl') d *= 1.25;
    if (p && p.id === 'tie' && B.refused) d *= 1.2;
    if (B.you.debuff) d *= 0.95;
    return Math.round(d);
  }

  /* ---------- 克制判定 ---------- */
  function counterOf(card, intent) {
    if (!intent) return { hit: false, crit: false, why: '' };
    if (card.critVs && card.critVs === intent.tag) return { hit: true, crit: true, why: '锁定程序瑕疵，必定暴击' };
    if (intent.type === 'def' && card.pierce) return { hit: true, crit: false, why: '穿透防御姿态' };
    if (intent.type === 'debuff' && card.dispel) return { hit: true, crit: false, why: '解除精神压制' };
    if (intent.tag === 'evidence' && ['c_burden', 'c_claim', 'c_labor_burden', 'c_illegal_ev'].indexOf(card.id) >= 0)
      return { hit: true, crit: false, why: '举证责任反制' };
    if (intent.tag === 'procedural' && card.subj === 'ssf') return { hit: true, crit: false, why: '程序规则反制' };
    if (intent.tag === 'text' && card.subj === 'fl') return { hit: true, crit: false, why: '法律解释穿透条文堆砌' };
    if (intent.tag === 'text' && card.subj === 'xz') return { hit: true, crit: false, why: '上位法压制' };
    if (B.case.tag === 'admin' && card.subj === 'xzf') return { hit: true, crit: false, why: '行政法专业对口' };
    if (B.case.tag === 'crime' && card.subj === 'xf') return { hit: true, crit: false, why: '刑法专业对口' };
    if (B.case.tag === 'civil' && card.subj === 'mf') return { hit: true, crit: false, why: '民法专业对口' };
    if (B.case.tag === 'labor' && (card.subj === 'mf' || card.id === 'c_labor_burden' || card.subj === 'ssf'))
      return { hit: true, crit: false, why: '劳动法语条对口' };
    if (B.case.tag === 'state' && (card.subj === 'xz' || card.subj === 'ssf')) return { hit: true, crit: false, why: '国家赔偿法条对口' };
    return { hit: false, crit: false, why: '' };
  }
  function kindName(t) { return { civil: '民事', crime: '刑事', admin: '行政', labor: '劳动争议', state: '国家赔偿' }[t] || t; }

  /* ---------- 开战 ---------- */
  C.start = function (caseObj, opts) {
    opts = opts || {};
    B = {
      case: caseObj, opts: opts, practice: !!opts.practice,
      round: 1, over: false, refused: !!opts.refused,
      foe: { name: opts.enemy || caseObj.battle.enemy, hp: opts.hp || caseObj.battle.hp, hpMax: opts.hp || caseObj.battle.hp, shield: 0, intent: null },
      you: { hp: youMaxHp(), hpMax: youMaxHp(), mp: youMaxMp(), mpMax: youMaxMp(), shield: 0, counter: 0, critUp: 0, critDur: 0, immune: 0, stripFoe: 0, debuff: null },
      foeWeaken: 0, foeWeakenDur: 0,
      deck: buildDeck(), hand: [], drawPile: [], log: [],
      stats: { played: 0, wrong: 0, crit: 0, counter: 0 }
    };
    if (opts.hitLaws && opts.hitLaws.length) B.log.push({ who: 'sys', x: '你在办案阶段选对了 <b>' + opts.hitLaws.map(x => G.card(x).name).join('、') + '</b>，这些卡在本庭伤害 +28%。' });
    if (opts.wrongLaws && opts.wrongLaws.length) B.log.push({ who: 'sys', x: '你误带的 <b class="bad">' + opts.wrongLaws.map(x => G.card(x).name).join('、') + '</b> 属于他案条文，庭上打出即适用法律错误。' });
    if (opts.evidenceWrong) B.log.push({ who: 'sys', x: '瑕疵证据 ' + opts.evidenceWrong + ' 份被对方点名，开局逻辑值 −' + opts.evidenceWrong * 4 });
    B.you.hp = Math.max(1, B.you.hp - (opts.evidenceWrong ? opts.evidenceWrong * 4 : 0));
    refill(); rollIntent();
    log('sys', '审判长宣布开庭。你的对手是 ' + B.foe.name + '。');
    if (caseObj.battle.taunt) log('foe', '「' + caseObj.battle.taunt + '」');
    G.go('court');
    render();
  };

  function buildDeck() {
    let d = G.s.deck.slice();
    if (d.length < 4) G.s.owned.forEach(id => { if (d.length < 5 && d.indexOf(id) < 0) d.push(id); });
    if (!d.length) d = D.cards.filter(c => c.starter).map(c => c.id);
    return d;
  }
  function refill() {
    let guard = 0;
    while (B.hand.length < 4 && guard++ < 12) {
      if (!B.drawPile.length) B.drawPile = B.deck.slice().sort(() => Math.random() - .5);
      const id = B.drawPile.pop();
      if (!id) break;
      B.hand.push(id);
    }
  }
  function rollIntent() {
    const mv = B.case.battle.moves || [];
    B.foe.intent = mv.length ? mv[Math.floor(Math.random() * mv.length)] : { name: '沉默施压', type: 'atk', tag: 'text', power: 8, text: '对方翻动卷宗，不说话。' };
  }
  function log(who, text) { B.log.unshift({ who: who, x: text }); if (B.log.length > 40) B.log.length = 40; }
  function popDmg(sel, val, cls) {
    const box = document.querySelector(sel);
    if (!box || !val) return;
    const s = document.createElement('span');
    s.className = 'dmgpop ' + (cls || '');
    s.textContent = '-' + val;
    s.style.left = (22 + Math.random() * 46) + '%';
    s.style.top = '26px';
    box.appendChild(s);
    setTimeout(function () { s.remove(); }, 1000);
  }

  /* ---------- 伤害结算 ---------- */
  function dealToYou(raw) {
    if (B.you.immune > 0) { log('sys', '免疫护持生效，本击伤害归零'); return 0; }
    let d = raw;
    if (B.you.debuff) d = Math.round(d * 1.2);
    if (B.you.shield > 0) {
      const bl = Math.min(B.you.shield, d); B.you.shield -= bl; d -= bl;
      if (bl) log('you', '护盾吸收 ' + bl + ' 点');
    }
    B.you.hp = Math.max(0, B.you.hp - d);
    if (d > 0) popDmg('#youPanel', d, 'bad');
    return d;
  }

  /* ---------- 玩家出牌 ---------- */
  function playCard(idx) {
    if (!B || B.over) return;
    const id = B.hand[idx], card = G.card(id);
    if (!card) return;
    if (card.cost > B.you.mp) { G.toast('法理值不足（需 ' + card.cost + '，现有 ' + B.you.mp + '）', 'bad'); return; }
    B.you.mp -= card.cost; B.hand.splice(idx, 1); B.stats.played++;

    /* 适用法律错误 */
    if (card.tags.indexOf(B.case.tag) < 0) {
      B.stats.wrong++;
      const p = G.primaryPersona();
      let back = 10 + (B.case.difficulty || 2) * 4;
      if (p && p.id === 'yan') { back = Math.round(back * 0.5); log('sys', '「严谨派」天赋生效：适用法律错误的反伤减半'); }
      const dealt = dealToYou(back);
      G.gain({ fame: -1 });
      log('foe', '你打出「' + card.name + '」（' + card.law + '）——与本案<b>' + kindName(B.case.tag) + '</b>案由不符，对方当庭反驳：<b class="bad">适用法律错误</b>，你被反击 <b>' + dealt + '</b> 逻辑值，声望 −1');
      render(); foeTurn(); return;
    }

    const ctr = counterOf(card, B.foe.intent);
    if (card.power) {
      let d = dmgOf(card);
      const critChance = B.you.critUp + G.buffVal('critUp') - G.buffVal('critDown') + (B.you.debuff ? -12 : 0);
      let crit = !!ctr.crit || (critChance > 0 && Math.random() * 100 < critChance);
      if (crit) { d = Math.round(d * 1.9); B.stats.crit++; G.s.lili += 1; }
      else if (ctr.hit) d = Math.round(d * 1.22);
      let blocked = 0;
      if (!card.pierce && B.foe.shield > 0) { blocked = Math.min(B.foe.shield, d); B.foe.shield -= blocked; d -= blocked; }
      B.foe.hp = Math.max(0, B.foe.hp - d);
      popDmg('#foePanel', d, crit ? 'gold' : '');
      log(crit ? 'crit' : 'you', '你打出【' + card.name + '】' + (ctr.why ? '（克制：' + ctr.why + '）' : '') +
        (crit ? '<b class="gold">正确法条暴击！</b>法理点+1 ' : '') + '对' + B.foe.name + '造成 <b>' + d + '</b> 点逻辑冲击' +
        (blocked ? '（护盾挡下 ' + blocked + '）' : ''));
    } else {
      log('you', '你打出【' + card.name + '】' + (ctr.why ? '（克制：' + ctr.why + '）' : '辅助生效'));
    }
    if (card.shield) { B.you.shield += card.shield; log('you', '逻辑护盾 +' + card.shield); }
    if (card.counter) { B.you.counter += card.counter; log('you', '反击姿态挂载：对方下一击将反噬 ' + card.counter + ' 点'); }
    if (card.mp) { B.you.mp = Math.min(B.you.mpMax, B.you.mp + card.mp); log('you', '法理值 +' + card.mp); }
    if (card.san) G.gain({ san: card.san });
    if (card.strip) { B.you.stripFoe = 1; log('sys', '对方下一招被当庭排除'); }
    if (card.stun) { B.foeWeaken = Math.max(B.foeWeaken, 25); B.foeWeakenDur = Math.max(B.foeWeakenDur, 2); log('sys', B.foe.name + ' 迟疑两回合，输出下降'); }
    if (card.weaken) { B.foeWeaken = Math.max(B.foeWeaken, card.weaken); B.foeWeakenDur = Math.max(B.foeWeakenDur, card.dur || 2); log('sys', '【比例原则压制】命中：对方输出 −' + card.weaken + '%'); }
    if (card.immune) { B.you.immune = Math.max(B.you.immune, card.immune); log('you', '获得 ' + card.immune + ' 回合免疫'); }
    if (card.critUp) { B.you.critUp = Math.max(B.you.critUp, card.critUp); B.you.critDur = Math.max(B.you.critDur, card.dur || 2); log('you', '暴击率 +' + card.critUp + '%'); }
    if (card.dispel && B.you.debuff) { log('sys', '负面状态「' + B.you.debuff.name + '」被解除'); B.you.debuff = null; }

    render(); foeTurn();
  }

  function defend() {
    if (!B || B.over) return;
    B.you.shield += 10;
    B.you.mp = Math.min(B.you.mpMax, B.you.mp + 4);
    B.stats.played++;
    log('you', '你申请<b>短暂休庭</b>：整理证据目录，护盾 +10，法理值 +4');
    render(); foeTurn();
  }

  function swapHand() {
    if (!B || B.over) return;
    B.drawPile = B.hand.concat(B.drawPile);
    B.hand = [];
    B.you.mp = Math.min(B.you.mpMax, B.you.mp + 1);
    B.stats.played++;
    log('you', '你申请<b>整理卷宗</b>：换掉全部手牌，重新核对证据目录（法理值 +1）');
    refill();
    render(); foeTurn();
  }

  /* ---------- 敌方回合 ---------- */
  function foeTurn() {
    if (!B || B.over) return;
    const mv = B.foe.intent;
    if (B.you.stripFoe > 0) {
      B.you.stripFoe = 0;
      log('sys', B.foe.name + ' 的【' + mv.name + '】被程序性排除，本招作废');
    } else if (mv.type === 'def') {
      B.foe.shield += mv.shield;
      log('foe', B.foe.name + ' 架起【' + mv.name + '】护盾 +' + mv.shield + '　<span class="tiny muted">' + mv.text + '</span>');
    } else if (mv.type === 'debuff') {
      B.you.debuff = { name: mv.name };
      log('foe', B.foe.name + ' 使用【' + mv.name + '】　<span class="tiny muted">' + mv.text + '</span> 我方被压制：受伤 +20%，伤害 −5%');
      const box = document.querySelector('#youPanel');
      if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); }
    } else {
      let d = mv.power;
      if (B.foeWeakenDur > 0) d = Math.round(d * (1 - B.foeWeaken / 100));
      const lv = G.levelOf(G.effAttr('ssf'));
      d = Math.max(4, Math.round(d * (1 + lv.idx * 0.06)));
      const dealt = dealToYou(d);
      log('foe', B.foe.name + ' 甩出【' + mv.name + '】造成 <b>' + dealt + '</b> 点逻辑冲击　<span class="tiny muted">' + mv.text + '</span>');
      if (B.you.counter > 0 && dealt > 0) {
        const c = B.you.counter; B.you.counter = 0;
        B.foe.hp = Math.max(0, B.foe.hp - c);
        B.stats.counter++; popDmg('#foePanel', c, 'gold');
        log('crit', '反击触发：<b class="gold">举证不能反杀 −' + c + '</b>');
      }
    }
    if (B.you.immune > 0) B.you.immune--;
    if (B.foeWeakenDur > 0 && --B.foeWeakenDur === 0) B.foeWeaken = 0;
    if (B.you.critDur > 1) B.you.critDur--; else { B.you.critDur = 0; B.you.critUp = 0; }
    const p = G.primaryPersona();
    B.you.mp = Math.min(B.you.mpMax, B.you.mp + 2 + (p && p.id === 'shi' ? 1 : 0));
    B.round++; rollIntent(); refill();
    render();
    if (checkEnd()) return;
    if (B.round > MAX_ROUND) timeUp();
  }

  function checkEnd() {
    if (!B || B.over) return true;
    if (B.foe.hp <= 0) { endBattle(true); return true; }
    if (B.you.hp <= 0) { endBattle(false); return true; }
    return false;
  }
  function timeUp() {
    if (B.you.hp / B.you.hpMax >= B.foe.hp / B.foe.hpMax) { log('sys', '辩论时限到，审判长按庭审表现裁定：我方占优'); endBattle(true); }
    else { log('sys', '辩论时限到，审判长按庭审表现裁定：对方占优'); endBattle(false); }
  }
  function endBattle(win) {
    B.over = win ? 'win' : 'lose';
    render();
    const opts = B.opts;
    if (B.practice) {
      if (win) { G.gain({ exp: { ssf: 6, fl: 4 }, lili: 1 }); G.addRankExp(2); }
      else G.gain({ san: -4 });
      G.dlg({

    h += '<div class="grid g2">' +
      '<div class="panel"><h3 style="margin:0 0 6px;font-size:18px">模拟法庭 · 自由练习赛</h3>' +

      '<div class="grid g2">' + SPARRING.map(function (sp, i) {

      }).join('') + '</div>' +
      '<div class="hr"></div><p class="tiny muted">血量上限 <b class="gold">' + youMaxHp() + '</b>｜法理上限 <b class="gold">' + youMaxMp() + '</b>｜人格天赋：' + (p ? p.name + '（' + p.perk + '）' : '未定型（先办案累积人格）') + '</p></div>' +

      '<div class="panel"><h3 style="margin:0 0 6px;font-size:18px">对战规则速查</h3>' +
      '<div class="timeline">' +
      [['回合流程', '对方亮出<b>下一招意图</b> → 你选手牌中克制的法条 → 命中即克制加成/暴击 → 对方出手 → 结算反击、护盾与回蓝。'],
       ['克制对照', '条文堆砌(text) → 法理解释穿透 / 宪法上位法压制<br>证据攻击(evidence) → 举证责任反制<br>程序拖延(procedural) → 诉讼法规则 / 程序正义暴击<br>防御姿态(def) → 穿透类终结技'],

  /* ---------- 战斗界面 ---------- */
  function render() {
    if (!B) { C.renderIdle(); return; }
    const el = document.getElementById('view-court');
    if (!el) return;
    const mv = B.foe.intent, you = B.you, p = G.primaryPersona();

    let h = '<div class="court">' +
      '<div class="roof"><b>⚖ ' + (B.practice ? '模拟法庭 · 训练赛' : B.case.name) + '</b>' +
      '<span class="tiny muted">' + kindName(B.case.tag) + '案由　第' + B.round + '/' + MAX_ROUND + '回合　段位 ' + G.rank().name + (p ? '　' + p.name : '') + '</span>' +
      (B.over ? '<span class="pill" style="border-color:var(--gold);color:var(--gold-lt)">' + (B.over === 'win' ? '✔ 胜诉' : '✘ 败诉') + '</span>' :
        '<button type="button" class="btn ghost sm" id="btnRetire">申请退庭</button>') + '</div>' +

      '<div class="duel">' +
      '<div class="fighter" id="youPanel">' +
      '<div class="who"><div class="avatar" style="background:linear-gradient(180deg,#2b446e,#1c3055)">🧑‍⚖️</div>' +
      '<div><b>你（' + G.rank().name + '）</b><small>抽牌堆 ' + B.drawPile.length + '｜出牌 ' + B.stats.played + '</small></div></div>' +
      '<div class="hpline"><span>逻辑值（血量）</span><span>' + you.hp + '/' + you.hpMax + '</span></div>' + bar('hp', you.hp, you.hpMax, you.hp / you.hpMax < 0.35) +
      '<div class="hpline"><span>法理值（蓝条）</span><span>' + you.mp + '/' + you.mpMax + '</span></div>' + bar('mp', you.mp, you.mpMax) +
      '<div class="hpline"><span>护盾 / 反击待命</span><span>' + you.shield + ' / ' + you.counter + '</span></div>' +
      (you.shield ? bar('sh', you.shield, 30) : '') +
      '<div class="chips-row">' +
      (you.critUp ? '<span class="statchip pos">暴击 +' + you.critUp + '%</span>' : '') +
      (you.immune ? '<span class="statchip pos">免疫 ' + you.immune + '回合</span>' : '') +
      (you.stripFoe ? '<span class="statchip pos">对方下一招将被排除</span>' : '') +
      (you.debuff ? '<span class="statchip neg">被压制：' + you.debuff.name + '</span>' : '') +
      (!you.debuff && !you.critUp && !you.immune && !you.stripFoe ? '<span class="statchip">状态正常</span>' : '') +
      '</div></div>' +

      '<div class="vscol"><div class="vsbalance serif">第 ' + B.round + '<br>回合</div><div style="font-size:24px">⚖</div>' +
      '<div class="vsbalance">克制 ' + B.stats.counter + '<br>暴击 ' + B.stats.crit + '<br>误用 ' + B.stats.wrong + '</div></div>' +

      '<div class="fighter" id="foePanel">' +
      '<div class="who"><div class="avatar" style="background:linear-gradient(180deg,#8f3b38,#5c2320)">👔</div>' +
      '<div><b>' + B.foe.name + '</b><small>护盾 ' + B.foe.shield + (B.foeWeakenDur ? '｜被削弱 −' + B.foeWeaken + '%（' + B.foeWeakenDur + '回合）' : '') + '</small></div></div>' +
      '<div class="hpline"><span>逻辑值</span><span>' + B.foe.hp + '/' + B.foe.hpMax + '</span></div>' + bar('hp', B.foe.hp, B.foe.hpMax, B.foe.hp / B.foe.hpMax < 0.35) +
      (B.foe.shield ? bar('sh', B.foe.shield, 30) : '') +
      '<div class="notebox" style="margin:9px 0 0"><b class="gold">对方下一步意图：</b>【' + (mv ? mv.name : '—') + '】' + (mv ? mv.text : '') +
      '<div class="tiny muted" style="margin-top:4px">' + (mv ? '类型 ' + ({ atk: '进攻', def: '防御', debuff: '精神压制' }[mv.type] || mv.type) +
        '　标签 ' + G.tagName(mv.tag) + (mv.power ? '　威力 ' + mv.power : '') + (mv.shield ? '　护盾 +' + mv.shield : '') : '') + '</div></div>' +
      '</div></div>' +

      '<div class="logbox" id="courtLog">' + B.log.map(function (l) {
        return '<p class="' + l.who + '">' + (l.who === 'you' ? '🜁 我方 · ' : l.who === 'foe' ? '🜂 对方 · ' : l.who === 'crit' ? '✦ ' : '⟡ · ') + l.x + '</p>';
      }).join('') + '</div>' +

      '<div class="hand">' + (B.over ? '' : B.hand.map(function (id, i) {
        const c = G.card(id);
        const ctr = counterOf(c, mv);
        const bad = c.tags.indexOf(B.case.tag) < 0;
        return '<button type="button" class="hcard' + (bad ? ' mismatch' : '') + '" data-play="' + i + '"' + (c.cost <= you.mp ? '' : ' disabled') + '>' +
          '<div class="hc">' + c.cost + '</div><div class="hn">' + c.name + '</div>' +
          '<div class="hl">' + c.law + '</div>' +
          '<div class="hd">' + (ctr.crit ? '★ ' + ctr.why : ctr.hit ? '★ ' + ctr.why : bad ? '⚠ 与本案案由不符' : '通用输出') +
          (c.power ? '｜伤害 ' + dmgOf(c) : c.shield ? '｜护盾 ' + c.shield : '') + '</div></button>';
      }).join('')) + '</div>' +

      '<div class="btnrow" style="padding:0 14px 14px">' +
      (B.over ? '<button type="button" class="btn gold" id="btnLeave">离开法庭</button>' :
        '<button type="button" class="btn" id="btnDefend" data-primary-action="1">🛡 申请休庭（护盾+10 法理+4）</button>' +
        '<button type="button" class="btn ghost" id="btnSwap">📁 整理卷宗（全部换手牌）</button>') +
      '</div></div>';

    el.innerHTML = h;
    el.querySelectorAll('[data-play]').forEach(function (b) { b.onclick = function () { playCard(+b.dataset.play); }; });
    const bd = el.querySelector('#btnDefend'); if (bd) bd.onclick = defend;
    const bw = el.querySelector('#btnSwap'); if (bw) bw.onclick = swapHand;
    const bl = el.querySelector('#btnLeave'); if (bl) bl.onclick = function () { B = null; C.renderIdle(); };
    const br = el.querySelector('#btnRetire'); if (br) br.onclick = function () {
      G.dlg({
        title: '确认退庭？', sub: '本庭将按撤诉/缺席处理',
        html: '<p class="sm">现在退庭等于放弃本案：声望 −6、理智 −8，并留下「临阵退庭」标签。</p>',
        actions: [{ label: '确认退庭', danger: true, fn: function () {
          G.gain({ fame: -6, san: -8 });
          if (G.s.labels.indexOf('临阵退庭') < 0) G.s.labels.push('临阵退庭');
          G.addLog('临阵退庭：<b>' + B.case.name + '</b>');
          const cb = B.opts && B.opts.onEnd, prac = B.practice;
          B = null; G.save();
          if (!prac && cb) cb(false); else { G.renderAll(); }
        } }, { label: '继续打', gold: true }]
      });
    };
  }

  C.isActive = function () { return !!B && !B.over; };
  C.clear = function () { B = null; };
  if (G.s) C.renderIdle();
})();

</script>
<script>
/* SECTION: side 考试副本 · 生涯路线 · 档案日志 */
(function () {
  'use strict';
  const D = window.LAW_DATA;
  const G = window.GAME;

  /* ==================== 考试副本 ==================== */
  const EX = (window.EXAM = {});

  EX.available = function (e) {
    if (e.stage === 'study') return G.s.stage === 'study' && G.s.term >= e.unlockTerm;
    if (e.stage === 'intern') return G.s.stage !== 'study';
    return G.s.stage === 'career';
  };
  function stageLabel(st) { return st === 'study' ? '在校（第' + (G.s.term) + '学期起）' : st === 'intern' ? '实习期起' : '执业期'; }

  EX.render = function () {
    const el = document.getElementById('view-exam');
    if (!el) return;
    const s = G.s;
    let h = '<div class="vhead"><h2>真实考试副本</h2><p>期末考、法考模拟、公考行测申论——把真实司法考试做成<b class="gold">副本</b>。通关解锁称号与 buff；挂科掉声望并触发负面人设标签。</p></div>';
    h += '<div class="grid g3">' + D.exams.map(function (e) {
      const ok = EX.available(e), taken = s.examScore[e.id];
      const can = ok && s.act >= 1 && s.energy >= e.cost;
      return '<div class="panel" style="border-color:' + (ok ? 'rgba(201,162,39,.4)' : 'rgba(255,255,255,.1)') + '">' +
        '<h3 style="margin:0 0 4px;font-size:18px">' + e.name + '</h3>' +
        '<p class="tiny muted" style="margin:0 0 8px">' + e.desc + '</p>' +
        '<div class="meta"><span class="tag">及格线 ' + e.pass + '分</span><span class="tag">精力 ' + e.cost + '</span><span class="tag">' + e.questions.length + ' 题</span></div>' +
        (taken ? '<p class="sm mt">上次成绩 <b class="' + (taken.pass ? 'ok' : 'bad') + '">' + taken.score + '分（' + (taken.pass ? '通过' : '未通过') + '）</b></p>' : '') +
        '<p class="tiny mt" style="margin:0">' + (ok ? '<span class="ok">可报考</span>' : '需 ' + stageLabel(e.stage)) + '</p>' +
        (ok ? '<button type="button" class="btn gold blk mt" data-exam="' + e.id + '"' + (can ? '' : ' disabled') + ' data-primary-action="1">' + (taken ? '再考一次' : '开始考试') + ' ▸</button>' : '') +
        (ok && !can ? '<p class="tiny bad" style="margin:6px 0 0">行动点或精力不足</p>' : '') +
        '</div>';
    }).join('') + '</div>';

    h += '<div class="panel mt"><h4 class="serif" style="margin:0 0 6px">称号与被动一览</h4>' +
      '<div class="grid g2">' +
      [['绩点之光', '期末通过｜下场辩论伤害 +10%'],
       ['法考上岸', '法考通过｜全学科判定永久 +5，解锁律师线'],
       ['上岸人', '公考通过｜解锁公职司法线岗位'],
       ['基层经验', '普法实践｜案件经验 +15%（持续 2 学期）'],
       ['风骨', '拒绝上级干预｜下场辩论伤害 +15%'],
       ['学业警示 / 败诉阴影', '负面标签｜限制转职、扣血上限']]
        .map(function (x) { return '<div class="perk"><span class="ic">🏅</span><div><b>' + x[0] + '</b><div class="tiny muted">' + x[1] + '</div></div></div>'; }).join('') +
      '</div></div>';

    el.innerHTML = h;
    el.querySelectorAll('[data-exam]').forEach(function (b) { b.onclick = function () { EX.start(b.dataset.exam); }; });
  };

  EX.start = function (id) {
    const e = D.exams.find(x => x.id === id);
    if (!e) return;
    if (!EX.available(e)) { G.toast('还没到报考阶段', 'bad'); return; }
    if (!G.actCost({ act: 1, energy: e.cost })) { G.renderAll(); return; }
    const run = EX.run = { exam: e, i: 0, right: 0, answers: [] };
    G.save(); G.renderStats();
    question();
  };

  function question() {
    const run = EX.run, e = run.exam, q = e.questions[run.i];
    const pct = Math.round(run.right / Math.max(1, run.i) * 100) || 0;
    G.dlg({
      title: e.name + ' · 第 ' + (run.i + 1) + '/' + e.questions.length + ' 题',
      sub: '当前正确率 ' + pct + '%　学科：' + G.subj(q.subj).name + '（' + G.levelOf(G.effAttr(q.subj)).name + '）',
      html: '<div class="facts">' + q.q + '</div><div class="mt">' +
        q.a.map(function (t, i) {
          return '<button type="button" class="opt" data-a="' + i + '"><span class="mk">' + 'ABCD'[i] + '</span>' + t + '</button>';
        }).join('') + '</div>',
      actions: [{ label: '交卷（跳过本题）', ghost: true, fn: function () { advance(null); } }]
    });
    document.querySelectorAll('[data-a]').forEach(function (b) {
      b.onclick = function () {
        const i = +b.dataset.a;
        const correct = i === q.c;
        if (correct) run.right++;
        b.classList.add(correct ? 'good' : 'evil');
        G.dlg({
          title: correct ? '✓ 答对' : '✗ 答错',
          sub: e.name + ' · 第 ' + (run.i + 1) + ' 题',
          html: '<p class="facts">' + q.q + '</p>' +
            '<p class="sm mt">正确答案：<b class="gold">' + 'ABCD'[q.c] + '. ' + q.a[q.c] + '</b></p>' +
            '<div class="notebox">📌 ' + q.why + '</div>',
          actions: [{ label: run.i + 1 >= e.questions.length ? '计算成绩' : '下一题 ▸', gold: true, fn: function () { advance(i); } }]
        });
      };
    });
  }
  function advance(ans) {
    const run = EX.run;
    run.answers.push(ans);
    run.i++;
    if (run.i >= run.exam.questions.length) { score(); return; }
    question();
  }

  function score() {
    const run = EX.run, e = run.exam;
    const pct = Math.round(run.right / e.questions.length * 100);
    const pass = pct >= e.pass;
    G.s.examScore[e.id] = { score: pct, pass: pass, term: G.s.term };
    const subjExp = {};
    e.questions.forEach(function (q) { subjExp[q.subj] = (subjExp[q.subj] || 0) + (pass ? 6 : 4); });
    if (pass) {
      const rw = e.reward;
      G.gain({ gold: rw.gold, fame: rw.fame, exp: subjExp, lili: 4 });
      if (rw.title && G.s.titles.indexOf(rw.title) < 0) G.s.titles.push(rw.title);
      if (rw.buff) G.s.buffs.push(Object.assign({}, rw.buff));
      if (rw.attrBuff) G.addLog('全学科判定永久 +5（法考上岸）');
      if (e.id === 'final' && G.s.labels.indexOf('学业警示') >= 0) {
        G.s.labels = G.s.labels.filter(x => x !== '学业警示');
        G.addLog('期末通过，「学业警示」解除，转职限制随之放开。');
      }
      G.addRankExp(8);
      G.dlg({
        title: '🎓 通过 · ' + e.name, sub: pct + ' 分（及格线 ' + e.pass + '）',
        html: '<p class="facts">' + (e.reward.note || '成绩单贴上了公告栏，名字排在前面。') + '</p>' +
          '<div class="grid g2 mt">' + [['成绩', pct + ' 分'], ['称号', e.reward.title || '—'],
          ['奖励', '金币 +' + e.reward.gold + '　声望 +' + e.reward.fame + '　法理点 +4'], ['学科经验', Object.keys(subjExp).map(k => G.subj(k).name + '+' + subjExp[k]).join('、')]]
            .map(function (x) { return '<div class="perk"><span class="ic">✦</span><div><b>' + x[0] + '</b><div class="tiny gold">' + x[1] + '</div></div></div>'; }).join('') + '</div>',
        actions: [{ label: '真好', gold: true, fn: function () { EX.run = null; G.save(); G.renderAll(); } }]
      });
      if (e.id === 'gongkao') G.addLog('公考通过：公职司法线岗位向你开放。');
    } else {
      const fe = e.failEffect;
      G.gain({ fame: fe.fame, san: fe.san, exp: subjExp });
      if (fe.label && G.s.labels.indexOf(fe.label) < 0) G.s.labels.push(fe.label);
      G.addLog('<b>' + e.name + '</b>未通过（' + pct + ' 分）：' + fe.note);
      G.dlg({
        title: '⚠ 未通过 · ' + e.name, sub: pct + ' 分（及格线 ' + e.pass + '）',
        html: '<div class="notebox bad">' + fe.note + '</div>' +
          '<p class="sm mt">声望 ' + fe.fame + '　理智 ' + fe.san + '　但错题没白做：' + Object.keys(subjExp).map(k => G.subj(k).name + '+' + subjExp[k]).join('、') +
          (fe.label ? '　新标签：<b class="bad">' + fe.label + '</b>' : '') + '</p>' +
          '<p class="tiny muted">挂科会掉声望、限制转职并触发负面人设标签。下次考前多刷对应学科。</p>',
        actions: [{ label: '回校园补课', gold: true, fn: function () { EX.run = null; G.go('campus'); } },
        { label: '再来一次', ghost: true, fn: function () { EX.run = null; G.save(); G.renderAll(); EX.start(e.id); } }]
      });
    }
    EX.run = null;
    G.save(); G.renderAll();
  }

  /* ==================== 生涯路线 ==================== */
  const CR = (window.CAREER = {});
  const needLabel = {
    fame: f => '声望 ≥ ' + f, rank: r => '段位 ≥ ' + r, title: t => '称号「' + t + '」',
    exam: x => '通过' + D.exams.find(e => e.id === x).name, studyTerm: n => '在校完成 ' + n + ' 学期',
    attr: o => Object.keys(o).map(k => G.subj(k).name + ' ≥ ' + o[k] + '（现 ' + G.effAttr(k) + '）').join('、'),
    moral: m => '徇私值 ≤ ' + m + '（现 ' + G.s.selfish + '）',
    studyAvg: v => '六科平均 ≥ ' + v + '（现 ' + Math.round(G.avgAttr()) + '）'
  };

  CR.checkNeed = function (need) {
    if (!need) return { ok: true, detail: ['无额外条件'] };
    const miss = [], hit = [];
    Object.keys(need).forEach(function (k) {
      let ok = false, cur = null;
      if (k === 'fame') { ok = G.s.fame >= need.fame; cur = G.s.fame; }
      else if (k === 'rank') { ok = G.s.rankIdx >= D.ranks.findIndex(r => r.name === need.rank); }
      else if (k === 'title') { ok = G.s.titles.indexOf(need.title) >= 0; }
      else if (k === 'exam') { ok = !!(G.s.examScore[need.exam] || {}).pass; }
      else if (k === 'studyTerm') { ok = G.s.term >= need.studyTerm; }
      else if (k === 'moral') { ok = G.s.selfish <= need.moral; }
      else if (k === 'studyAvg') { ok = G.avgAttr() >= need.studyAvg; }
      else if (k === 'attr') { ok = Object.keys(need.attr).every(x => G.effAttr(x) >= need.attr[x]); }
      (ok ? hit : miss).push((needLabel[k] || (x => k))(need[k]));
    });
    return { ok: !miss.length, detail: hit.concat(miss), miss: miss };
  };
  CR.canTake = function (node) { return CR.checkNeed(node.need); };

  CR.render = function () {
    const el = document.getElementById('view-career');
    if (!el) return;
    const s = G.s;
    let h = '<div class="vhead"><h2>职业三分支结局</h2><p>' +
      '法学生 → 实习法律人 → <b class="gold">公职司法 / 律师执业 / 企业法务</b> 三条路线，各自的晋升树、解锁玩法与终极结局。走错会通向坏结局。</p></div>';

    if (s.stage !== 'career') {
      h += '<div class="notebox warn">当前还在' + (s.stage === 'study' ? '在校期' : '实习期') + '。职业分流在<b>执业期</b>开启（在校 3 学期 + 实习 2 学期）。' +
        '这段时间请把属性、法条卡、法考与公考副本攒起来——三条线的门槛不一样。</div>';
    }

    h += '<div class="grid g3">' + ['gov', 'lawyer', 'legal'].map(function (k) {
      const c = D.careers[k];
      const req = CR.checkNeed(c.need);
      const chosen = s.career === k;
      return '<div class="route" style="border-color:' + (chosen ? c.color : 'rgba(255,255,255,.12)') + '">' +
        '<h4 style="color:' + c.color + '">' + c.icon + ' ' + c.name + '</h4>' +
        '<p class="tiny muted" style="margin:0 0 8px">' + c.tagline + '｜' + c.desc + '</p>' +
        '<div class="meta" style="margin-bottom:8px">' + req.detail.map(function (x) {
          return '<span class="tag" style="color:' + (req.miss && req.miss.indexOf(x) >= 0 ? '#f0938c' : '#84d59a') + '">' +
            (req.miss && req.miss.indexOf(x) >= 0 ? '✗ ' : '✓ ') + x + '</span>';
        }).join('') + '</div>' +
        c.nodes.map(function (n, i) {
          const nodeReq = CR.canTake(n);
          const cur = chosen && s.jobNode === i;
          const done = chosen && s.jobNode >= i;
          return '<div class="node' + (cur ? ' cur' : done ? '' : ' lockd') + '">' +
            '<span class="dot">' + (done ? '✓' : i + 1) + '</span>' +
            '<div><b class="serif">' + n.name + '</b><div class="tiny muted">' + n.actions.slice(0, 3).join('、') + '</div>' +
            '<div class="tiny" style="color:' + (nodeReq.ok ? '#84d59a' : '#8d9bb2') + '">月薪 ' + n.salary + '　' + (n.need ? nodeReq.detail.join('；') : '基础岗') + '</div></div></div>';
        }).join('') +
        '<div class="hr"></div>' +
        '<p class="tiny" style="margin:0 0 8px"><b class="gold">终极结局：</b>' + c.ending.name + '<br><span class="muted">' + c.ending.text + '</span></p>' +
        (chosen ? '<span class="pill" style="border-color:' + c.color + ';color:' + c.color + '">当前路线</span>' :
          (s.stage === 'career' && req.ok ? '<button type="button" class="btn gold blk" data-choose="' + k + '" data-primary-action="1">选择这条路线 ▸</button>' :
            '<button type="button" class="btn blk" disabled>' + (s.stage === 'career' ? '条件未满足' : '执业期可选') + '</button>')) +
        '</div>';
    }).join('') + '</div>';

    h += '<div class="panel mt"><h4 class="serif" style="margin:0 0 6px">人设 · 声望 · 道德系统（灵魂系统）</h4>' + G.personaRow() + '</div>';

    el.innerHTML = h;
    el.querySelectorAll('[data-choose]').forEach(function (b) {
      b.onclick = function () { CR.takeJob(b.dataset.choose, 0, true); };
    });
  };

  CR.takeJob = function (routeId, idx, first) {
    const c = D.careers[routeId];
    if (!c) return;
    /* 挂科留下的「学业警示」限制转职 */
    if (first && G.s.labels.indexOf('学业警示') >= 0) {
      G.toast('档案里挂着「学业警示」，转职被限制：先通过一次期末考试', 'bad');
      G.addLog('转职申请被卡：学业警示未消除');
      return;
    }
    if (first && G.s.selfish >= 3) {
      G.toast('停职检查期间不得入职新岗位', 'bad');
      return;
    }
    if (first) {
      G.s.labels = G.s.labels.filter(x => x !== '学业警示');
      G.addLog('通过择业审核，「学业警示」标记从档案解除。');
    }
    G.s.career = routeId;
    G.s.jobNode = idx;
    G.s.income = c.nodes[idx].salary;
    G.addRankExp(6);
    G.addLog((first ? '确定职业路线：<b>' : '晋升为 <b>') + c.nodes[idx].name + '</b>（' + c.name + '）');
    G.save();
    G.dlg({
      title: (first ? '🎯 ' : '📈 晋升：') + c.nodes[idx].name,
      sub: c.name + ' · ' + c.tagline,
      html: '<p class="facts">' + (first ? c.desc : c.nodes[idx].actions.join('、')) + '</p>' +
        '<p class="sm mt">月薪折算 <b class="gold">' + c.nodes[idx].salary + ' 金币/学期</b>。解锁案件与日常工作已同步到「校园/案件」视图。</p>' +
        (first ? '<div class="notebox">职业选择不可随意反悔——换线会重置岗位层级（各线独立积累）。</div>' : ''),
      actions: [{ label: '开始工作', gold: true, fn: function () { G.go('campus'); } }]
    });
    G.renderAll();
  };

  /* ==================== 档案日志 ==================== */
  const RC = (window.RECORD = {});
  RC.render = function () {
    const el = document.getElementById('view-record');
    if (!el) return;
    const s = G.s, p = G.primaryPersona();
    const total = D.cases.length;
    let h = '<div class="vhead"><h2>个人档案与办案日志</h2><p>你的每一次判案选择都在改写职业人格。档案跟着你走完整个司法人生。</p></div>';

    h += '<div class="grid g2"><div class="panel">' +
      '<h3 style="margin:0 0 8px;font-size:18px">基本档案</h3>' +
      '<div class="grid g4">' +
      [['学期', '第' + s.term + '学期'], ['阶段', { study: '法学院在校', intern: '法律实习', career: '执业期' }[s.stage]],
       ['段位', G.rank().name + '（' + s.rankExp + '）'], ['主导人格', p ? p.name : '未定型'],
       ['庭辩战绩', s.wins + ' 胜 ' + s.losses + ' 负'], ['结案', s.doneCases.length + '/' + total],
       ['持有法条卡', s.owned.length + '/' + D.cards.length], ['卡组', s.deck.length + '/8'],
       ['称号', s.titles.join('、') || '暂无'], ['负面标签', s.labels.join('、') || '清白'],
       ['徇私值', s.selfish + '/5'], ['路线', s.career ? D.careers[s.career].name + ' · ' + (s.jobNode >= 0 ? D.careers[s.career].nodes[s.jobNode].name : '未入职') : '未分流']]
        .map(function (x) { return '<div class="perk"><span class="ic">·</span><div><div class="tiny muted">' + x[0] + '</div><b class="sm">' + x[1] + '</b></div></div>'; }).join('') +
      '</div>' +
      '<div class="hr"></div><h4 class="serif" style="margin:0 0 6px">属性总览</h4>' + G.attrPanel() +
      '</div>' +

      '<div class="panel"><h3 style="margin:0 0 8px;font-size:18px">案卷归档</h3>' +
      D.cases.map(function (c) {
        const sc = s.caseScore[c.id];
        return '<div class="node' + (sc ? '' : ' lockd') + '"><span class="dot">' + (sc ? sc.grade : '·') + '</span>' +
          '<div><b class="serif">' + c.name + '</b>' +
          '<div class="tiny muted">' + c.kindName + '　' + '★'.repeat(c.difficulty) + '</div>' +
          '<div class="tiny" style="color:' + (sc ? (sc.win ? '#84d59a' : '#f0938c') : '#8d9bb2') + '">' +
          (sc ? (sc.win ? '胜诉 · 表现 ' + sc.perf + '% · 第' + sc.term + '学期' : '败诉 · 第' + sc.term + '学期') : '未办理') + '</div></div></div>';
      }).join('') +
      '<div class="hr"></div><h4 class="serif" style="margin:0 0 6px">考试记录</h4>' +
      (Object.keys(s.examScore).length ? D.exams.map(function (e) {
        const r = s.examScore[e.id];
        return '<div class="hpline"><span>' + e.name + '</span><span class="' + (r.pass ? 'ok' : 'bad') + '">' + r.score + ' 分 · ' + (r.pass ? '通过' : '未通过') + '（第' + r.term + '学期）</span></div>';
      }).join('') : '<p class="tiny muted">尚无考试记录。期末考从第 2 学期开始。</p>') +
      '</div></div>';

    h += '<div class="panel mt"><h3 style="margin:0 0 8px;font-size:18px">人生日志</h3><div class="timeline">' +
      (s.log.length ? s.log.map(function (l) { return '<div class="tl"><span class="tm">' + l.t + '</span><br>' + l.x + '</div>'; }).join('') : '<p class="muted sm">还没有故事。去校园安排一次行动，或受理第一个案件。</p>') +
      '</div></div>';

    h += '<div class="panel mt"><h4 class="serif" style="margin:0 0 6px">框架补充说明（本 Demo 自行完善的规则）</h4>' +
      '<div class="grid g2">' +
      [['行动点节拍', '每学期 5 点行动：日常 1 点、办案 1 点+精力 15、考试 1 点+精力。结束学期回精力并触发随机事件。'],
       ['经济闭环', '金币来自办案/兼职/薪资；法理点是解锁法条卡的唯一货币，来自胜诉、暴击与普法。'],
       ['伤害公式', '卡牌伤害 × (1 + 学科属性/100×0.62) × 办案命中加成 × buff × 人格天赋；克制判定命中则 +22%，标注 critVs 者必定暴击。'],
       ['失败惩罚', '败诉：声望 −8、理智 −12、标签「败诉阴影」（血量上限 −8）；误用法条额外累积徇私值。'],
       ['段位驱动', '段位经验来自胜诉与日常工作，决定可晋升岗位与可解锁的高阶案件。'],
       ['坏结局链', '徇私值 1→通报批评，2→征信扣分，3→停职检查，5→吊销执业证书（结束本局）。']]
        .map(function (x) { return '<div class="perk"><span class="ic">🧩</span><div><b>' + x[0] + '</b><div class="tiny muted">' + x[1] + '</div></div></div>'; }).join('') +
      '</div>' +
      '<p class="tiny muted mt">正式版建议接入：真实裁判文书数据、法考主观题分档阅卷、二审/再审关卡、双人对战庭辩、多周目人格继承。</p></div>';

    el.innerHTML = h;
  };

  if (G.s) { EX.render(); CR.render(); RC.render(); }
})();

</script>
</body>
</html>
